<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="app-version" content="owner-2026-10-22.2">
<title>Pusat Kendali Owner · Es Teh S.O.L.O</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
<style>
  /* Pusat Kendali Owner: halaman khusus Owner untuk memantau & mengendalikan semua cabang.
     Kerja harian (tambah stok, belanja, tutup kas, transaksi) tetap di aplikasi kasir (index.html).
     Desain: gelap profesional + kartu emas (pilihan Boss, gabungan contoh A & G). */
  :root{ --emas:#c9a94a; --emas1:#e2c05c; --emas2:#a87d1e; --teks:#e8efe9; --redup:#9fb3a6; --redup2:#8ea596;
    --kaca:rgba(255,255,255,.05); --garis:rgba(255,255,255,.09); --hijau:#5fd38a; --merah:#ef8a80; --kuning:#f1d27a; }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased;color:var(--teks);
    background:#0b1a12 url(latar.jpg) center/cover fixed;}
  .layar{min-height:100vh;background:linear-gradient(180deg,rgba(8,20,13,.62),rgba(8,20,13,.93) 420px,rgba(8,20,13,.95));}
  .wrap{max-width:720px;margin:0 auto;padding:18px 16px 32px;}
  button{font-family:inherit;}
  svg.ic{width:1em;height:1em;flex:none;}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;}
  .top .t{font-size:10.5px;letter-spacing:1.6px;color:var(--emas);font-weight:700;}
  .top h1{margin:3px 0 0;font-size:19px;font-weight:700;}
  .top .d{font-size:12px;color:var(--redup);margin-top:2px;}
  .ib{display:flex;gap:8px;}
  .ibtn{width:38px;height:38px;border-radius:10px;border:1px solid rgba(201,169,74,.55);background:transparent;color:var(--emas);
    display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;}
  .ibtn.polos{border-color:rgba(255,255,255,.2);color:var(--teks);}
  .seg{display:flex;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:3px;margin-bottom:14px;}
  .seg button{flex:1;min-width:0;border:0;background:transparent;font-size:12.5px;font-weight:600;padding:9px 4px;border-radius:8px;color:var(--redup);cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .seg button.on{background:var(--emas);color:#10140c;}
  .gold{border-radius:18px;padding:16px;background:linear-gradient(135deg,var(--emas1),var(--emas2));color:#1a1300;box-shadow:0 10px 30px rgba(0,0,0,.35);}
  .gold small{font-size:12px;font-weight:700;opacity:.8;}
  .gold .n{display:block;font-size:30px;font-weight:800;letter-spacing:-.5px;margin:2px 0;}
  .gold .naik{font-size:12px;font-weight:700;color:#1d4d1f;} .gold .turun{font-size:12px;font-weight:700;color:#7a1d12;}
  .gold .r{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .gold .r div{background:rgba(255,255,255,.32);border-radius:11px;padding:9px 11px;font-size:11.5px;font-weight:700;display:flex;flex-direction:column;}
  .gold .r b{font-size:16px;margin-top:2px;}
  .gold .r span{font-weight:600;font-size:10.5px;opacity:.75;margin-top:1px;}
  .spark{width:100%;height:32px;margin-top:6px;display:block;}
  .al{display:flex;gap:10px;align-items:center;font-size:12.5px;font-weight:600;color:var(--kuning);background:rgba(241,210,122,.08);
    border:1px solid rgba(241,210,122,.25);border-radius:11px;padding:10px 12px;margin-top:12px;cursor:pointer;}
  .al svg{font-size:18px;}
  .h{font-size:11px;letter-spacing:1.4px;color:var(--redup);font-weight:700;margin:18px 0 8px;}
  .it{width:100%;display:flex;align-items:center;gap:12px;padding:12px;background:var(--kaca);border:1px solid var(--garis);border-radius:13px;
    margin-bottom:7px;color:var(--teks);text-align:left;cursor:pointer;}
  .it:hover{background:rgba(255,255,255,.08);}
  .it i{display:flex;width:38px;height:38px;border-radius:10px;background:rgba(201,169,74,.14);color:var(--emas);align-items:center;justify-content:center;flex:none;font-size:19px;}
  .it b{display:block;font-size:14.5px;font-weight:600;}
  .it small{font-size:11.5px;color:var(--redup2);}
  .it .v{margin-left:auto;text-align:right;font-size:12.5px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:4px;}
  .it .v em{font-style:normal;color:#5d7466;font-size:18px;}
  .bd{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;}
  .bd.kn{background:rgba(241,210,122,.15);color:var(--kuning);} .bd.hj{background:rgba(95,211,138,.15);color:var(--hijau);} .bd.mr{background:rgba(239,138,128,.15);color:var(--merah);}
  .kasir{width:100%;display:flex;justify-content:center;align-items:center;gap:8px;margin-top:14px;padding:12px;border-radius:12px;background:transparent;
    border:1px solid rgba(201,169,74,.55);color:var(--emas);font-weight:700;font-size:14px;cursor:pointer;}
  .keluar{width:100%;margin-top:8px;padding:10px;border:0;background:transparent;color:var(--redup2);font-weight:600;font-size:13px;cursor:pointer;}
  .panel{display:none;}
  .panel.on{display:block;}
  /* isi modul */
  .sec{background:var(--kaca);border:1px solid var(--garis);border-radius:14px;padding:14px;margin-bottom:10px;}
  .sec h3{margin:0 0 8px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .sec h3 small{font-size:11.5px;color:var(--redup2);font-weight:600;}
  .baris{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.07);font-size:13px;}
  .sec h3 + .baris, .sec .sub + .baris{border-top:0;}
  .baris small{display:block;font-size:11px;color:var(--redup2);font-weight:500;margin-top:1px;}
  .baris .kanan{text-align:right;white-space:nowrap;font-weight:700;}
  .baris a{color:var(--emas);text-decoration:none;}
  .sub{font-weight:700;font-size:12px;letter-spacing:.8px;color:var(--redup);margin:10px 0 2px;}
  .min{color:var(--merah);} .plus{color:var(--hijau);}
  .kosong{color:var(--redup2);font-size:12.5px;padding:6px 0;}
  .info{font-size:12.5px;color:var(--redup);}
  .tabel{width:100%;border-collapse:collapse;font-size:12.5px;}
  .tabel th{text-align:left;font-size:10.5px;letter-spacing:.6px;color:var(--redup);background:rgba(255,255,255,.06);padding:8px;font-weight:700;}
  .tabel td{padding:9px 8px;border-top:1px solid rgba(255,255,255,.07);}
  .tabel .r{text-align:right;white-space:nowrap;}
  .tabel tr.tot td{background:rgba(255,255,255,.04);font-weight:700;}
  .gulir{overflow-x:auto;}
  .label-cab{display:inline-block;font-size:10.5px;font-weight:700;background:rgba(239,138,128,.15);color:var(--merah);border-radius:6px;padding:1px 6px;margin-left:4px;}
  .gbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:10px;font-weight:700;font-size:13px;border:0;cursor:pointer;}
  .gbtn.gelap{background:#1a1300;color:var(--emas1);} .gbtn.terang{background:rgba(255,255,255,.35);color:#1a1300;}
  .btn{border:1px solid rgba(201,169,74,.55);background:transparent;color:var(--emas);border-radius:9px;padding:6px 12px;font-weight:700;font-size:12.5px;cursor:pointer;}
  .muat{color:var(--redup);text-align:center;padding:40px 10px;font-weight:600;}
  /* kotak isi nominal (titik ribuan otomatis) */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:90;padding:16px;}
  .overlay.on{display:flex;}
  .modal{background:#12251a;border:1px solid rgba(201,169,74,.4);color:var(--teks);border-radius:16px;padding:18px;width:100%;max-width:380px;}
  .modal h4{margin:0 0 12px;font-size:15px;white-space:pre-line;}
  .modal input{width:100%;min-width:0;font-family:inherit;font-size:22px;font-weight:700;padding:11px;border-radius:10px;border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.06);color:var(--teks);margin-bottom:10px;outline:none;}
  .modal input:focus{border-color:var(--emas);}
  .modal .tbl{display:flex;gap:8px;margin-top:6px;}
  .modal .tbl button{flex:1;padding:11px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;}
  .fold{border-top:1px solid rgba(255,255,255,.07);}
  .sec h3 + .fold{border-top:0;}
  .fold summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 0;cursor:pointer;font-size:13px;}
  .fold summary::-webkit-details-marker{display:none;}
  .fold .fic{font-size:20px;}
  .fold .ft{flex:1;min-width:0;}
  .fold .ft b{display:block;font-size:13.5px;}
  .fold .ft small{font-size:11px;color:var(--redup2);}
  .fold .pan{color:var(--redup2);transition:transform .2s;}
  .fold[open] .pan{transform:rotate(180deg);}
  .fold[open] .fic{filter:brightness(1.2);}
  .fold > .baris{padding-left:30px;}
</style>
</head>
<body>
<div class="layar"><div class="wrap">
  <div id="muat" class="muat">Memuat Pusat Kendali…</div>
  <div id="isi" style="display:none;">
    <div class="top" id="topBeranda">
      <div><div class="t">PUSAT KENDALI · ES TEH S.O.L.O</div><h1 id="sapa">Halo, Boss</h1><div class="d" id="tgl"></div></div>
      <div class="ib"><button class="ibtn" onclick="muatSemua()" title="Perbarui" data-ic="refresh"></button><button class="ibtn" id="inisial" title="Keluar" onclick="keluar()" style="font-size:13px;font-weight:700;">B</button></div>
    </div>
    <div class="top" id="topPanel" style="display:none;">
      <div style="display:flex;gap:10px;align-items:center;"><button class="ibtn polos" onclick="buka('beranda')" title="Kembali" data-ic="back"></button>
        <div><div class="t">MODUL</div><h1 id="judulPanel" style="margin:0;">-</h1></div></div>
      <div class="ib"><button class="ibtn" onclick="muatSemua()" title="Perbarui" data-ic="refresh"></button></div>
    </div>
    <div class="seg" id="cabPilih"></div>

    <!-- BERANDA -->
    <div class="panel on" id="p-beranda">
      <div class="gold">
        <small>Penjualan hari ini</small>
        <b class="n" id="aJual">…</b>
        <span id="aBanding" class="naik"></span>
        <svg class="spark" id="aSpark" viewBox="0 0 100 26" preserveAspectRatio="none"></svg>
        <div class="r">
          <div><span style="font-size:11.5px;opacity:1;margin:0;font-weight:700;" id="aKasLbl">Kas outlet</span><b id="aKas">…</b><span id="aKasRinci"></span></div>
          <div onclick="buka('brankas')" style="cursor:pointer;"><span style="font-size:11.5px;opacity:1;margin:0;font-weight:700;">🔒 Brankas</span><b id="aBrankas">…</b><span>khusus Owner</span></div>
        </div>
      </div>
      <div class="al" id="aWarn" style="display:none;" onclick="buka('stok')"></div>
      <div class="h">MODUL KENDALI</div>
      <div id="daftarModul"></div>
      <button class="kasir" onclick="keKasir()"><span data-ic="kasir" style="display:flex;font-size:18px;"></span>Buka aplikasi kasir</button>
      <button class="keluar" onclick="keluar()">Keluar dari akun</button>
    </div>

    <div class="panel" id="p-uang"><div id="uangIsi"></div></div>
    <div class="panel" id="p-brankas"><div id="brankasIsi"></div></div>
    <div class="panel" id="p-stok"><div id="stokIsi"></div></div>
    <div class="panel" id="p-beli"><div id="beliIsi"></div></div>
    <div class="panel" id="p-menu"><div id="menuIsi"></div></div>
    <div class="panel" id="p-karyawan"><div id="karyawanIsi"></div></div>
    <div class="panel" id="p-cabang"><div id="cabangIsi"></div></div>
    <div class="panel" id="p-laporan"><div id="laporanIsi"></div></div>
  </div>
</div></div>

<div class="overlay" id="nomOverlay">
  <div class="modal">
    <h4 id="nomJudul"></h4>
    <input type="text" inputmode="numeric" id="nomInput" autocomplete="off" placeholder="0">
    <input type="text" id="nomKet" autocomplete="off" placeholder="Keterangan (boleh kosong)" style="font-size:15px;font-weight:500;">
    <div class="tbl">
      <button style="background:transparent;border:1px solid rgba(255,255,255,.25);color:#e8efe9;" onclick="tutupNom(false)">Batal</button>
      <button style="background:#c9a94a;border:1px solid #c9a94a;color:#10140c;" onclick="tutupNom(true)">Oke</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ywoytgapbshpzrdwdtel.supabase.co";
const SUPABASE_KEY = "sb_publishable_yxfWIKFL9NbgcOZpnAqV-g_o6PhL0GK";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const BATAS_CUP = 100;
const NOL = '00000000-0000-0000-0000-000000000000';

let user = null, profil = null, cabangList = [], pilihan = 'semua', panelAktif = 'beranda';

const fmt = n => (Number(n) < 0 ? '−Rp' : 'Rp') + Math.abs(Number(n || 0)).toLocaleString('id-ID');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jamWIB = t => new Date(t).toLocaleString('id-ID', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
// nama pendek cabang: "es teh solo pusat dermo" -> "Pusat Dermo", "cabang es teh solo 1" -> "Es Teh Solo 1"
const rapiNama = n => { let s = String(n || '').replace(/^cabang\s+/i, ''); const t = s.replace(/^es teh solo\s+/i, ''); if(t.length > 2) s = t; return s.replace(/\b\w/g, h => h.toUpperCase()); };
const namaCab = id => { const c = cabangList.find(x => x.id === id); return c ? rapiNama(c.nama) : '-'; };
// ikon garis (tanpa emoji) supaya tampilan rapi & profesional
const IKON = {
  uang:'<path d="M3 7h18v10H3z"/><circle cx="12" cy="12" r="2.5"/><path d="M6 10v4M18 10v4"/>',
  stok:'<path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  menu:'<path d="M7 3h10l-1 18H8z"/><path d="M6 8h12"/>',
  karyawan:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.3"/><path d="M16 14c3 0 5 2.2 5 5"/>',
  cabang:'<path d="M3 10l2-6h14l2 6"/><path d="M4 10v10h16V10"/><path d="M3 10h18M10 20v-5h4v5"/>',
  laporan:'<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h7"/>',
  warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  refresh:'<path d="M20 11a8 8 0 10-2.3 5.7"/><path d="M20 4v7h-7"/>',
  kasir:'<path d="M4 4h2l2 11h11l2-8H7"/><circle cx="9" cy="19" r="1.5"/><circle cx="18" cy="19" r="1.5"/>',
  brankas:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="12" r="3.5"/><path d="M12 8.5V7M12 17v-1.5M7 20v1.5M17 20v1.5"/>',
  beli:'<path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 016 0"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>'
};
const ic = k => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IKON[k] || ''}</svg>`;
const MODUL = [
  ['uang', 'Uang', 'Kas, Brankas Online, laba'],
  ['brankas', 'Brankas', 'Saldo, tambah, ambil, riwayat'],
  ['stok', 'Stok', 'Bahan & cup tiap cabang'],
  ['beli', 'Pembelian', 'Belanja & beli stok tiap cabang'],
  ['menu', 'Menu & Harga', 'Harga jual & modal'],
  ['karyawan', 'Karyawan', 'Aktif, absen, izin'],
  ['cabang', 'Cabang', 'Daftar cabang'],
  ['laporan', 'Laporan', 'Tutup kas & log aktivitas']
];
const cabDipilih = () => pilihan === 'semua' ? cabangList : cabangList.filter(c => c.id === pilihan);
const awalHari = () => { const d = new Date(); d.setHours(0,0,0,0); return d.toISOString(); };

// ---------- masuk ----------
async function mulai(){
  document.querySelectorAll('[data-ic]').forEach(el => el.innerHTML = ic(el.dataset.ic));
  document.getElementById('tgl').textContent = new Date().toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ location.replace('index.html'); return; }
  user = session.user;
  const { data: p } = await sb.from('users').select('id, nama, role').eq('id', user.id).single();
  if(!p || p.role !== 'owner'){ location.replace('index.html?kasir=1'); return; }
  profil = p;
  const jam = new Date().getHours();
  const waktu = jam < 11 ? 'pagi' : jam < 15 ? 'siang' : jam < 18 ? 'sore' : 'malam';
  document.getElementById('sapa').textContent = `Selamat ${waktu}, ${p.nama || 'Boss'}`;
  document.getElementById('inisial').textContent = String(p.nama || 'B').split(/\s+/).map(k => k[0]).join('').slice(0, 2).toUpperCase();
  const { data: cab } = await sb.from('cabang').select('id, nama').eq('aktif', true).order('nama');
  // cabang pusat paling kiri, lalu cabang lain
  cabangList = (cab || []).sort((x, y) => (/pusat/i.test(y.nama) ? 1 : 0) - (/pusat/i.test(x.nama) ? 1 : 0));
  // setiap dibuka selalu mulai di cabang pusat (Pusat Dermo)
  pilihan = cabangList.length ? cabangList[0].id : 'semua';
  gambarCabang();
  document.getElementById('muat').style.display = 'none';
  document.getElementById('isi').style.display = '';
  muatSemua();
}

function gambarCabang(){
  const tombol = [...cabangList.map(c => [c.id, rapiNama(c.nama)]), ['semua','Semua cabang']];
  document.getElementById('cabPilih').innerHTML = tombol.map(([id, lbl]) =>
    `<button class="${id === pilihan ? 'on' : ''}" onclick="pilihCabang('${id}')">${esc(lbl)}</button>`).join('');
}
function pilihCabang(id){
  pilihan = id;
  gambarCabang();
  muatSemua();
}
function buka(p){
  panelAktif = p;
  document.querySelectorAll('.panel').forEach(el => el.classList.toggle('on', el.id === 'p-' + p));
  document.getElementById('topBeranda').style.display = p === 'beranda' ? '' : 'none';
  document.getElementById('topPanel').style.display = p === 'beranda' ? 'none' : '';
  const m = MODUL.find(x => x[0] === p);
  document.getElementById('judulPanel').textContent = m ? m[1] : '';
  document.getElementById('cabPilih').style.display = p === 'brankas' ? 'none' : '';
  window.scrollTo(0, 0);
  muatPanel();
}
function muatSemua(){ muatBeranda(); if(panelAktif !== 'beranda') muatPanel(); }
function muatPanel(){
  ({ uang: muatUang, brankas: muatBrankas, stok: muatStok, beli: muatBeli, menu: muatMenu, karyawan: muatKaryawan, cabang: muatCabang, laporan: muatLaporan }[panelAktif] || (()=>{}))();
}
function keKasir(){
  // ke aplikasi kasir tanpa dilempar balik ke sini
  try{ sessionStorage.setItem('ownerKeKasir', '1'); }catch(e){}
  if(pilihan !== 'semua'){ try{ localStorage.setItem('activeCabang_' + user.id, pilihan); }catch(e){} }
  location.href = 'index.html?kasir=1';
}
async function keluar(){
  if(!confirm('Keluar dari akun Owner?')) return;
  await sb.auth.signOut();
  location.replace('index.html');
}

// ---------- hitungan uang (sama dengan aplikasi kasir) ----------
// kas cabang = uang laci sejak tutup kas terakhir (sisa + tunai − keluar laci) + saldo Kas Es Teh S.O.L.O
async function kasCabang(c){
  const { data: last } = await sb.from('kas_shift').select('kas_fisik, kas_ditinggal, waktu_tutup')
    .eq('cabang_id', c.id).order('waktu_tutup', { ascending:false }).limit(1).maybeSingle();
  const sejak = last ? last.waktu_tutup : '2000-01-01T00:00:00Z';
  const hari = awalHari();
  const [tx, by, kt, txHari, byHari] = await Promise.all([
    sb.from('transaksi').select('total').eq('cabang_id', c.id).eq('status','selesai').eq('metode_bayar','tunai').gt('created_at', sejak),
    sb.rpc('laporan_biaya_kas', { p_cabang: c.id, p_sejak: sejak }),
    sb.rpc('kas_toko_saldo', { p_cabang: c.id }),
    sb.from('transaksi').select('total, metode_bayar').eq('cabang_id', c.id).eq('status','selesai').gte('created_at', hari),
    sb.rpc('laporan_biaya_kas', { p_cabang: c.id, p_sejak: hari })
  ]);
  const jumlah = (rows, k='jumlah') => (rows || []).reduce((a, r) => a + Number(r[k] || 0), 0);
  const keluar = jumlah((by.data || []).filter(b => new Date(b.created_at) > new Date(sejak)));
  const laci = (last ? Number(last.kas_ditinggal ?? last.kas_fisik) : 0) + jumlah(tx.data, 'total') - keluar;
  const rowsHari = txHari.data || [];
  return {
    id: c.id, nama: c.nama,
    kas: laci + Number(kt.data || 0),
    jual: jumlah(rowsHari, 'total'),
    tunai: jumlah(rowsHari.filter(r => (r.metode_bayar || 'tunai') === 'tunai'), 'total'),
    online: jumlah(rowsHari.filter(r => r.metode_bayar === 'online'), 'total'),
    trx: rowsHari.length,
    keluarHari: jumlah(byHari.data),
    tutup: last ? last.waktu_tutup : null
  };
}
async function saldoBrankas(){
  const { data } = await sb.from('brankas').select('jenis, jumlah');
  return (data || []).reduce((a, r) => a + (r.jenis === 'masuk' ? 1 : -1) * Number(r.jumlah), 0);
}
async function barangHampirHabis(){
  const ids = cabDipilih().map(c => c.id);
  const hasil = [];
  try{
    const { data: cup } = await sb.rpc('laporan_stok_cup');
    (cup || []).filter(r => ids.includes(r.cabang_id) && Number(r.stok) <= BATAS_CUP)
      .forEach(r => hasil.push({ cabang: r.cabang_id, nama: r.nama, stok: Number(r.stok), satuan: 'pcs' }));
  }catch(e){}
  const { data: bh } = await sb.from('bahan_baku_stok').select('stok, cabang_id, bahan:bahan_baku_id(nama, satuan, dihitung_stok)')
    .in('cabang_id', ids.length ? ids : [NOL]).lte('stok', 0);
  (bh || []).filter(r => r.bahan && r.bahan.dihitung_stok && !/^cup/i.test(r.bahan.nama))
    .forEach(r => hasil.push({ cabang: r.cabang_id, nama: r.bahan.nama, stok: Number(r.stok), satuan: r.bahan.satuan || '' }));
  return hasil.sort((a, b) => a.stok - b.stok);
}

// grafik kecil penjualan 7 hari + perbandingan dengan kemarin di jam yang sama
async function grafikPenjualan(ids, jualHariIni){
  const awal = new Date(); awal.setHours(0,0,0,0); awal.setDate(awal.getDate() - 6);
  const { data } = await sb.from('transaksi').select('total, created_at').in('cabang_id', ids.length ? ids : [NOL])
    .eq('status', 'selesai').gte('created_at', awal.toISOString()).limit(20000);
  const hari = Array(7).fill(0);
  const kemarinAwal = new Date(); kemarinAwal.setHours(0,0,0,0); kemarinAwal.setDate(kemarinAwal.getDate() - 1);
  const kemarinJamIni = new Date(Date.now() - 864e5);
  let kemarin = 0;
  (data || []).forEach(r => {
    const t = new Date(r.created_at);
    const i = Math.floor((t - awal) / 864e5);
    if(i >= 0 && i < 7) hari[i] += Number(r.total || 0);
    if(t >= kemarinAwal && t <= kemarinJamIni) kemarin += Number(r.total || 0);
  });
  hari[6] = jualHariIni;
  const maks = Math.max(...hari, 1);
  const titik = hari.map((v, i) => `${(i * 100 / 6).toFixed(1)},${(23 - v / maks * 20).toFixed(1)}`).join(' ');
  document.getElementById('aSpark').innerHTML = `<polyline fill="none" stroke="#1a1300" stroke-opacity=".55" stroke-width="2" vector-effect="non-scaling-stroke" points="${titik}"/>`;
  const el = document.getElementById('aBanding');
  if(kemarin > 0){
    const pr = Math.round((jualHariIni - kemarin) / kemarin * 100);
    el.className = pr >= 0 ? 'naik' : 'turun';
    el.dataset.banding = `${pr >= 0 ? '▲' : '▼'} ${Math.abs(pr)}% dari kemarin jam segini`;
  } else { el.className = 'naik'; el.dataset.banding = ''; }
}

let beliHari = 7;
function periodeBeli(h){ beliHari = h; muatBeli(); }
const danaLbl = d => d === 'tunai' ? 'Uang laci' : d === 'kas_toko' ? 'Kas Outlet' : 'Uang lain';
async function muatBeli(){
  const box = document.getElementById('beliIsi');
  if(!box.innerHTML) box.innerHTML = '<div class="muat">Memuat…</div>';
  const cabs = cabDipilih(), ids = cabs.map(c => c.id).concat(NOL);
  const awal = new Date(); awal.setHours(0,0,0,0); awal.setDate(awal.getDate() - (beliHari - 1));
  const [pb, by, hist] = await Promise.all([
    sb.from('pembelian').select('id, cabang_id, bahan_baku_id, jumlah, harga_satuan, total, catatan, sumber_dana, created_at, bahan:bahan_baku_id(nama, satuan, satuan_beli), oleh:dibeli_oleh(nama)')
      .in('cabang_id', ids).gte('created_at', awal.toISOString()).order('created_at', { ascending:false }).limit(300),
    sb.from('biaya_operasional').select('id, cabang_id, kategori, deskripsi, jumlah, sumber_dana, created_at, oleh:dicatat_oleh(nama)')
      .in('cabang_id', ids).gte('created_at', awal.toISOString()).gt('jumlah', 0).order('created_at', { ascending:false }).limit(300),
    // harga beli sebelumnya per bahan (untuk tanda harga naik)
    sb.from('pembelian').select('bahan_baku_id, harga_satuan, created_at').in('cabang_id', ids).lt('created_at', awal.toISOString()).order('created_at', { ascending:false }).limit(300)
  ]);
  const beli = pb.data || [], belanja = (by.data || []).filter(b => !String(b.deskripsi || '').startsWith('DIBATALKAN'));
  const hargaLama = {};
  (hist.data || []).forEach(h => { if(!(h.bahan_baku_id in hargaLama)) hargaLama[h.bahan_baku_id] = Number(h.harga_satuan); });
  const sum = (a, k) => a.reduce((t, r) => t + Number(r[k] || 0), 0);
  const totBeli = sum(beli, 'total'), totBelanja = sum(belanja, 'jumlah');
  // per cabang
  const perCab = cabs.map(c => ({ c, b: sum(beli.filter(r => r.cabang_id === c.id), 'total'), j: sum(belanja.filter(r => r.cabang_id === c.id), 'jumlah') }));
  // per sumber dana
  const dana = {};
  beli.forEach(r => dana[r.sumber_dana || 'tunai'] = (dana[r.sumber_dana || 'tunai'] || 0) + Number(r.total || 0));
  belanja.forEach(r => dana[r.sumber_dana || 'tunai'] = (dana[r.sumber_dana || 'tunai'] || 0) + Number(r.jumlah || 0));
  // rekap bahan: jumlah dibeli, total, harga terakhir vs sebelumnya
  const bahan = {};
  [...beli].reverse().forEach(r => {
    const k = r.bahan_baku_id, b = bahan[k] || (bahan[k] = { nama: (r.bahan && r.bahan.nama) || '-', sat: (r.bahan && (r.bahan.satuan_beli || r.bahan.satuan)) || '', qty: 0, total: 0, kali: 0, hargaAwal: null, hargaAkhir: 0 });
    b.qty += Number(r.jumlah || 0); b.total += Number(r.total || 0); b.kali++;
    const h = Number(r.harga_satuan || 0);
    if(b.hargaAwal == null) b.hargaAwal = k in hargaLama ? hargaLama[k] : h;
    b.hargaAkhir = h;
  });
  const rekap = Object.values(bahan).sort((x, y) => y.total - x.total);
  const naik = rekap.filter(b => b.hargaAwal > 0 && b.hargaAkhir > b.hargaAwal * 1.001);
  const rp = n => 'Rp' + Math.round(Number(n || 0)).toLocaleString('id-ID');
  // riwayat gabungan per tanggal
  const riwayat = [
    ...beli.map(r => ({ t: r.created_at, cab: r.cabang_id, judul: `📦 Beli ${(r.bahan && r.bahan.nama) || '-'} ${Number(r.jumlah).toLocaleString('id-ID')} ${(r.bahan && (r.bahan.satuan_beli || r.bahan.satuan)) || ''}`, oleh: r.oleh && r.oleh.nama, dana: r.sumber_dana, n: r.total, ket: r.harga_satuan ? '@' + rp(r.harga_satuan) : '' })),
    ...belanja.map(r => ({ t: r.created_at, cab: r.cabang_id, judul: `🧾 ${r.kategori}${r.deskripsi ? ' · ' + String(r.deskripsi).split(' · ')[0] : ''}`, oleh: r.oleh && r.oleh.nama, dana: r.sumber_dana, n: r.jumlah, ket: '' }))
  ].sort((a, b) => new Date(b.t) - new Date(a.t));
  let tglLalu = '';
  const isiRiwayat = riwayat.map(r => {
    const tgl = new Date(r.t).toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long' });
    const kepala = tgl !== tglLalu ? `<div class="sub">${esc(tgl.toUpperCase())}</div>` : '';
    tglLalu = tgl;
    return kepala + `<div class="baris"><span>${esc(r.judul)}<small>${new Date(r.t).toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' })} · ${esc(r.oleh || '-')}${cabs.length > 1 ? ' · ' + esc(namaCab(r.cab)) : ''} · ${danaLbl(r.dana)}${r.ket ? ' · ' + esc(r.ket) : ''}</small></span><span class="kanan min">− ${fmt(r.n)}</span></div>`;
  }).join('');
  box.innerHTML = `
    <div class="seg">${[[1,'Hari ini'],[7,'7 hari'],[30,'30 hari']].map(([h, l]) => `<button class="${h === beliHari ? 'on' : ''}" onclick="periodeBeli(${h})">${l}</button>`).join('')}</div>
    <div class="gold" style="margin-bottom:10px;"><small>Total uang keluar · ${beliHari === 1 ? 'hari ini' : beliHari + ' hari'}</small><b class="n">${fmt(totBeli + totBelanja)}</b>
      <div class="r"><div>📦 Beli stok<b>${fmt(totBeli)}</b><span>${beli.length} kali</span></div><div>🧾 Belanja harian<b>${fmt(totBelanja)}</b><span>${belanja.length} kali</span></div></div></div>
    ${naik.length ? `<div class="al" style="cursor:default;">${ic('warn')}<span>Harga naik: ${naik.map(b => `${esc(b.nama)} ${rp(b.hargaAwal)} → ${rp(b.hargaAkhir)}`).join(' · ')}</span></div>` : ''}
    ${cabs.length > 1 ? `<div class="sec" style="margin-top:10px;"><h3>Per cabang</h3>${perCab.map(p => `<div class="baris"><span>${esc(rapiNama(p.c.nama))}<small>Beli stok ${fmt(p.b)} · Belanja ${fmt(p.j)}</small></span><span class="kanan">${fmt(p.b + p.j)}</span></div>`).join('')}</div>` : ''}
    <div class="sec" style="margin-top:10px;"><h3>Sumber uang</h3>
      ${Object.keys(dana).length ? Object.entries(dana).map(([k, v]) => `<div class="baris"><span>${danaLbl(k)}</span><span class="kanan">${fmt(v)}</span></div>`).join('') : '<div class="kosong">Belum ada.</div>'}
    </div>
    <div class="sec"><h3>Bahan yang dibeli <small>harga per satuan</small></h3>
      ${rekap.map(b => { const up = b.hargaAwal > 0 && b.hargaAkhir > b.hargaAwal * 1.001, turun = b.hargaAwal > 0 && b.hargaAkhir < b.hargaAwal * 0.999;
        return `<div class="baris"><span>${esc(b.nama)}<small>${b.qty.toLocaleString('id-ID')} ${esc(b.sat)} · ${b.kali}× beli · harga terakhir ${rp(b.hargaAkhir)}${up ? ' <span class="label-cab">naik</span>' : turun ? ' <span class="label-cab" style="background:rgba(95,211,138,.15);color:var(--hijau)">turun</span>' : ''}</small></span><span class="kanan">${fmt(b.total)}</span></div>`; }).join('') || '<div class="kosong">Belum ada beli stok di periode ini.</div>'}
    </div>
    <div class="sec"><h3>Riwayat <small>terbaru di atas</small></h3>${isiRiwayat || '<div class="kosong">Belum ada pembelian/belanja di periode ini.</div>'}</div>
    <div class="sec info">Pembelian & belanja dicatat Admin atau Kasir di aplikasi kasir. Di sini Boss memantau & membandingkan tiap cabang.</div>`;
}

// pengeluaran dikelompokkan per hari (folder: hari, tanggal, jumlah, total)
function folderPengeluaran(rows){
  if(!rows.length) return '<div class="kosong">Tidak ada pengeluaran.</div>';
  const grup = [];
  rows.forEach(b => {
    const d = new Date(b.created_at); const k = d.toDateString();
    let g = grup.find(x => x.k === k);
    if(!g){ g = { k, d, isi: [] }; grup.push(g); }
    g.isi.push(b);
  });
  return grup.map(g => {
    const tot = g.isi.reduce((a, b) => a + Number(b.jumlah || 0), 0);
    const hari = g.d.toLocaleDateString('id-ID', { weekday:'long' });
    const tgl = g.d.toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' });
    return `<details class="fold"><summary><span class="fic">📁</span><span class="ft"><b>${esc(hari)}, ${esc(tgl)}</b><small>${g.isi.length} pengeluaran</small></span><span class="kanan min">− ${fmt(tot)}</span><span class="pan">▾</span></summary>
      ${g.isi.map(b => `<div class="baris"><span>${esc(b.kategori)} · ${esc(String(b.deskripsi || '').split(' · ')[0])}<small>${new Date(b.created_at).toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' })} · ${esc(namaCab(b.cabang_id))} · ${esc((b.pencatat && b.pencatat.nama) || '-')} · ${b.sumber_dana === 'tunai' ? 'uang laci' : b.sumber_dana === 'kas_toko' ? 'Kas Outlet' : 'uang lain'}</small></span><span class="kanan min">− ${fmt(b.jumlah)}</span></div>`).join('')}
    </details>`;
  }).join('');
}

  let opAktif = {};
  try{ const r = await sb.from('cabang').select('id, opname_aktif').in('id', cabs.map(c => c.id)); (r.data || []).forEach(x => opAktif[x.id] = x.opname_aktif !== false); }catch(e){}
  const OP_MULAI = new Date(2026, 9, 23), hariIni = new Date(); hariIni.setHours(0,0,0,0);
  const opJadwal = hariIni < OP_MULAI ? null : new Date(OP_MULAI.getTime() + Math.floor((hariIni - OP_MULAI) / (14 * 864e5)) * 14 * 864e5);
  const opBerikut = opJadwal ? new Date(opJadwal.getTime() + 14 * 864e5) : OP_MULAI;
  const tglOp = d => new Date(d).toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  const htmlOpname = c => {
    const aktif = opAktif[c.id] !== false;
    const tombol = `<button class="btn" style="padding:3px 10px;font-size:11.5px;${aktif ? '' : 'color:var(--redup);border-color:rgba(255,255,255,.2);'}" onclick="aturOpname('${c.id}', ${!aktif})">${aktif ? 'ON' : 'OFF'}</button>`;
    if(!aktif) return `<div class="sub" style="display:flex;justify-content:space-between;align-items:center;">STOK OPNAME ${tombol}</div><div class="kosong">Stok opname dimatikan untuk cabang ini.</div>`;
    const o = opname.find(x => x.cabang_id === c.id);
    const telat = opJadwal && (!o || new Date(o.created_at) < opJadwal);
    let isi = telat ? `<div class="baris"><span>Belum opname untuk jadwal ${tglOp(opJadwal)}</span><span class="kanan min">belum</span></div>` : '';
    if(o){
      const sel = (o.detail || []).filter(d => Number(d.selisih) !== 0);
      // batas wajar kurang: barang pcs maks. 3, bahan lain maks. 3% (sama dengan aplikasi kasir)
      const lewatBatas = d => Number(d.selisih) < 0 && (d.satuan === 'pcs' ? -Number(d.selisih) > 3 : -Number(d.selisih) > Math.max(0, Number(d.sebelum)) * 0.03);
      const nLewat = sel.filter(lewatBatas).length;
      isi += `<div class="baris"><span>${tglOp(o.created_at)}<small>oleh ${esc(o.nama_oleh || '-')} · ${(o.detail || []).length} barang dihitung</small></span><span class="kanan ${nLewat ? 'min' : ''}">${nLewat ? nLewat + ' lewat batas' : sel.length ? 'wajar' : 'pas'}</span></div>`
        + sel.map(d => { const k = Number(d.konversi) > 0 && d.satuan_beli ? Number(d.konversi) : 1; const v = Number(d.selisih) / k;
          return `<div class="baris"><span>${esc(d.nama)}<small>${lewatBatas(d) ? 'lewat batas wajar' : v < 0 ? 'masih wajar' : ''}</small></span><span class="kanan ${lewatBatas(d) ? 'min' : ''}">${v < 0 ? 'kurang' : 'lebih'} ${Math.abs(v).toLocaleString('id-ID', { maximumFractionDigits: 2 })} ${esc(k !== 1 && d.satuan_beli ? d.satuan_beli : (d.satuan || ''))}</span></div>`; }).join('');
    } else if(!telat) isi += '<div class="kosong">Belum pernah opname.</div>';
    return `<div class="sub" style="display:flex;justify-content:space-between;align-items:center;">STOK OPNAME · berikutnya ${tglOp(opBerikut)} ${tombol}</div>` + isi;
  };
  const bahan = await Promise.all(cabs.map(c => sb.from('bahan_baku_stok')
    .select('stok, bahan:bahan_baku_id(nama, satuan, dihitung_stok)').eq('cabang_id', c.id).then(r => ({ c, rows: (r.data || []).filter(x => x.bahan && x.bahan.dihitung_stok) }))));
  box.innerHTML = cabs.map(c => {
    const cupC = cup.filter(r => r.cabang_id === c.id);
    const bh = (bahan.find(b => b.c.id === c.id) || { rows: [] }).rows.filter(r => !/^cup/i.test(r.bahan.nama)).sort((a, b) => a.stok - b.stok);
    return `<div class="sec"><h3>${esc(namaCab(c.id))}</h3>
      ${htmlOpname(c)}
      <div class="sub">CUP</div>
      ${cupC.map(r => { const perHari = Number(r.pakai_7hari || 0) / Math.max(1, Number(r.hari_data || 1)); const hari = perHari > 0 ? Math.floor(Number(r.stok) / perHari) : null;
        return `<div class="baris"><span>${esc(r.nama)}<small>${perHari > 0 ? `pakai ±${Math.round(perHari)}/hari · cukup ±${hari} hari` : 'belum ada pemakaian'}</small></span><span class="kanan ${Number(r.stok) <= BATAS_CUP ? 'min' : ''}">${Number(r.stok)} pcs</span></div>`; }).join('') || '<div class="kosong">Belum ada data cup.</div>'}
      <div class="sub">BAHAN BAKU</div>
      ${bh.map(r => `<div class="baris"><span>${esc(r.bahan.nama)}</span><span class="kanan ${Number(r.stok) <= 0 ? 'min' : ''}">${Number(r.stok).toLocaleString('id-ID')} ${esc(r.bahan.satuan || '')}</span></div>`).join('') || '<div class="kosong">Belum ada data bahan.</div>'}
    </div>`;
  }).join('') + '<div class="sec info">Tambah / beli stok dicatat Admin atau Kasir di aplikasi kasir. Di sini Boss cukup memantau.</div>';
}

// ---------- menu & harga ----------
async function muatMenu(){
  const box = document.getElementById('menuIsi');
  box.innerHTML = '<div class="muat">Memuat…</div>';
  const cabs = cabDipilih();
  const hasil = await Promise.all(cabs.map(c => sb.from('produk')
    .select('id, nama, aktif, tipe_harga, harga_kecil, harga_besar, harga_modal_kecil, harga_modal_besar, kategori:kategori_id(nama), produk_varian(label, harga, harga_modal, urutan)')
    .eq('cabang_id', c.id).order('nama').then(r => ({ c, rows: r.data || [] }))));
  box.innerHTML = hasil.map(({ c, rows }) => `<div class="sec"><h3>${esc(namaCab(c.id))} <small>${rows.filter(p => p.aktif).length} menu aktif · ketuk harga untuk ubah</small></h3>
    ${rows.map(p => {
      const harga = p.tipe_harga === 'varian'
        ? (p.produk_varian || []).slice().sort((a, b) => a.urutan - b.urutan).map(v => `${esc(v.label)} ${fmt(v.harga)}`).join(' · ')
        : `<a href="#" onclick="ubahHarga('${p.id}','kecil',${Number(p.harga_kecil)});return false;">Kecil ${fmt(p.harga_kecil)}</a> · <a href="#" onclick="ubahHarga('${p.id}','besar',${Number(p.harga_besar)});return false;">Besar ${fmt(p.harga_besar)}</a>`;
      const modal = p.tipe_harga === 'varian' ? '' : `modal ${fmt(p.harga_modal_kecil)} / ${fmt(p.harga_modal_besar)}`;
      return `<div class="baris"><span>${esc(p.nama)}${p.aktif ? '' : ' <span class="label-cab">nonaktif</span>'}<small>${esc((p.kategori && p.kategori.nama) || '')}${modal ? ' · ' + modal : ''}</small></span><span class="kanan" style="font-weight:700;">${harga}</span></div>`;
    }).join('') || '<div class="kosong">Belum ada menu.</div>'}
  </div>`).join('') + '<div class="sec info">Tambah menu baru, resep, dan SOP: buka lewat tombol Buka aplikasi kasir → Pengaturan (sementara, sampai dipindah ke sini).</div>';
}
async function ubahHarga(id, ukuran, lama){
  const r = await mintaNominal(`Harga jual ukuran ${ukuran} baru:`, lama, false);
  if(!r) return;
  const kolom = ukuran === 'besar' ? 'harga_besar' : 'harga_kecil';
  const { error } = await sb.from('produk').update({ [kolom]: r.jumlah }).eq('id', id);
  if(error){ alert('Gagal: ' + error.message); return; }
  await catatLog('Ubah Harga', `Harga ${ukuran} diubah ${fmt(lama)} → ${fmt(r.jumlah)} (lewat Pusat Kendali)`);
  muatMenu();
}

// ---------- karyawan ----------
async function muatKaryawan(){
  const box = document.getElementById('karyawanIsi');
  box.innerHTML = '<div class="muat">Memuat…</div>';
  const ids = cabDipilih().map(c => c.id);
  const semua = pilihan === 'semua';
  let qAbs = sb.from('absensi').select('waktu_masuk, waktu_keluar, terverifikasi, jarak_meter, cabang_id, user:user_id(nama)').gte('waktu_masuk', new Date(Date.now() - 2*864e5).toISOString()).order('waktu_masuk', { ascending:false }).limit(40);
  let qIzin = sb.from('izin_keluar').select('alasan, waktu_mulai, waktu_selesai, status, cabang_id, user:user_id(nama)').order('waktu_mulai', { ascending:false }).limit(15);
  if(!semua){ qAbs = qAbs.eq('cabang_id', pilihan); qIzin = qIzin.eq('cabang_id', pilihan); }
  const [us, uc, aktif, abs, izin] = await Promise.all([
    sb.from('users').select('id, nama, role, cabang_id').order('role'),
    sb.from('user_cabang').select('user_id, cabang_id'),
    sb.from('user_presence').select('user_id, cabang_id, last_seen_at, user:user_id(nama, role)').order('last_seen_at', { ascending:false }),
    qAbs, qIzin
  ]);
  const cabUser = {};
  (uc.data || []).forEach(r => (cabUser[r.user_id] = cabUser[r.user_id] || []).push(r.cabang_id));
  const akun = (us.data || []).filter(u => u.role !== 'owner').filter(u => semua || u.cabang_id === pilihan || (cabUser[u.id] || []).includes(pilihan));
  const peran = { admin:'Admin', kasir:'Kasir' };
  const aktifRows = (aktif.data || []).filter(a => semua || a.cabang_id === pilihan);
  box.innerHTML = `
    <div class="sec"><h3>Aktif sekarang</h3>
      ${aktifRows.map(a => `<div class="baris"><span>${esc((a.user && a.user.nama) || '-')}<small>${esc(peran[(a.user || {}).role] || '')} · ${esc(namaCab(a.cabang_id))}</small></span><span class="kanan" style="font-weight:600;">terakhir ${jamWIB(a.last_seen_at)}</span></div>`).join('') || '<div class="kosong">Tidak ada yang aktif.</div>'}
    </div>
    <div class="sec"><h3>Akun karyawan</h3>
      ${akun.map(u => `<div class="baris"><span>${esc(u.nama)}<small>${esc(peran[u.role] || u.role)} · ${esc(((cabUser[u.id] && cabUser[u.id].length) ? cabUser[u.id] : [u.cabang_id]).filter(Boolean).map(namaCab).join(', ') || 'belum ada cabang')}</small></span></div>`).join('') || '<div class="kosong">Belum ada akun karyawan di cabang ini.</div>'}
      <div class="kosong">Tambah akun / reset password: lewat Buka aplikasi kasir → Profil → Karyawan (sementara).</div>
    </div>
    <div class="sec"><h3>Absen 2 hari terakhir</h3>
      ${(abs.data || []).map(a => `<div class="baris"><span>${esc((a.user && a.user.nama) || '-')}<small>${esc(namaCab(a.cabang_id))}${a.terverifikasi === false ? ' · ⚠️ belum terverifikasi' : ''}${a.jarak_meter != null ? ' · ' + Math.round(a.jarak_meter) + ' m' : ''}</small></span><span class="kanan" style="font-weight:600;">${jamWIB(a.waktu_masuk)} → ${a.waktu_keluar ? new Date(a.waktu_keluar).toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' }) : 'masih kerja'}</span></div>`).join('') || '<div class="kosong">Belum ada absen.</div>'}
    </div>
    <div class="sec"><h3>Izin keluar terbaru</h3>
      ${(izin.data || []).map(z => `<div class="baris"><span>${esc((z.user && z.user.nama) || '-')} · ${esc(z.alasan || '')}<small>${esc(namaCab(z.cabang_id))} · ${jamWIB(z.waktu_mulai)}${z.waktu_selesai ? ' → ' + new Date(z.waktu_selesai).toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' }) : ''}</small></span><span class="kanan" style="font-weight:600;">${esc(z.status || '')}</span></div>`).join('') || '<div class="kosong">Belum ada izin.</div>'}
    </div>`;
}

    </div>
    <div class="sec"><h3>Log aktivitas <small>siapa melakukan apa</small></h3>
      ${logRows.map(l => `<div class="baris"><span>${esc(l.aksi)}<small>${esc(l.keterangan || '')}</small><small>${jamWIB(l.created_at)} · ${esc((l.pelaku && l.pelaku.nama) || '-')}${l.cabang_id ? ' · ' + esc(namaCab(l.cabang_id)) : ''}</small></span></div>`).join('') || '<div class="kosong">Belum ada log.</div>'}
    </div>`;
}

// ---------- brankas (satu untuk semua cabang, khusus Owner) ----------
let brankasFilter = 'semua', brankasBatas = 50;
function filterBrankas(f){ brankasFilter = f; brankasBatas = 50; muatBrankas(); }
function brankasLagi(){ brankasBatas += 50; muatBrankas(); }
async function muatBrankas(){
  const box = document.getElementById('brankasIsi');
  if(!box.innerHTML) box.innerHTML = '<div class="muat">Memuat…</div>';
  const awalBulan = new Date(); awalBulan.setHours(0,0,0,0); awalBulan.setDate(1);
  let q = sb.from('brankas').select('jenis, jumlah, keterangan, created_at, cabang_id, pencatat:dicatat_oleh(nama)').order('created_at', { ascending:false }).limit(brankasBatas + 1);
  if(brankasFilter !== 'semua') q = q.eq('jenis', brankasFilter);
  const [semua, riwayat] = await Promise.all([sb.from('brankas').select('jenis, jumlah, created_at'), q]);
  const rows = semua.data || [];
  const saldo = rows.reduce((a, r) => a + (r.jenis === 'masuk' ? 1 : -1) * Number(r.jumlah), 0);
  const bulanIni = rows.filter(r => new Date(r.created_at) >= awalBulan);
  const jml = j => bulanIni.filter(r => r.jenis === j).reduce((a, r) => a + Number(r.jumlah), 0);
  const daftar = (riwayat.data || []).slice(0, brankasBatas);
  const adaLagi = (riwayat.data || []).length > brankasBatas;
  const namaBulan = awalBulan.toLocaleDateString('id-ID', { month:'long' });
  // kelompokkan per tanggal supaya mudah dibaca
  let tglLalu = '';
  const isi = daftar.map(r => {
    const tgl = new Date(r.created_at).toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long' });
    const kepala = tgl !== tglLalu ? `<div class="sub">${esc(tgl.toUpperCase())}</div>` : '';
    tglLalu = tgl;
    return kepala + `<div class="baris"><span>${esc(r.keterangan || (r.jenis === 'masuk' ? 'Masuk' : 'Ambil'))}
      <small>${new Date(r.created_at).toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' })} · ${esc((r.pencatat && r.pencatat.nama) || '-')}${r.cabang_id ? ' · ' + esc(namaCab(r.cabang_id)) : ''}</small></span>
      <span class="kanan ${r.jenis === 'masuk' ? 'plus' : 'min'}">${r.jenis === 'masuk' ? '+' : '−'} ${fmt(r.jumlah)}</span></div>`;
  }).join('');
  box.innerHTML = `
    <div class="gold" style="margin-bottom:10px;"><small>🔒 Saldo Brankas · khusus Owner</small><b class="n">${fmt(saldo)}</b>
      <div style="display:flex;gap:8px;margin-top:8px;"><button class="gbtn gelap" onclick="brankasTambah()">${ic('plus')} Tambah uang</button><button class="gbtn terang" onclick="brankasAmbil()">${ic('minus')} Ambil</button></div>
      <div class="r"><div>Masuk ${esc(namaBulan)}<b>${fmt(jml('masuk'))}</b></div><div>Diambil ${esc(namaBulan)}<b>${fmt(jml('keluar'))}</b></div></div></div>
    <div class="seg">${[['semua','Semua'],['masuk','Masuk'],['keluar','Diambil']].map(([k, l]) => `<button class="${k === brankasFilter ? 'on' : ''}" onclick="filterBrankas('${k}')">${l}</button>`).join('')}</div>
    <div class="sec"><h3>Riwayat Brankas <small>terbaru di atas</small></h3>
      ${isi || '<div class="kosong">Belum ada catatan.</div>'}
      ${adaLagi ? '<button class="btn" style="width:100%;margin-top:8px;" onclick="brankasLagi()">Tampilkan lebih banyak</button>' : ''}
    </div>`;
}
async function brankasTambah(){
  const r = await mintaNominal('Tambah uang ke Brankas berapa?', '', true);
  if(!r) return;
  // kas_shift_id nol = bukan dari laci (tidak mengurangi uang laci)
  const { error } = await sb.from('brankas').insert({ cabang_id: pilihan !== 'semua' ? pilihan : (cabangList[0] || {}).id, jenis:'masuk', jumlah: r.jumlah,
    keterangan: 'Tambah uang Owner' + (r.ket ? ' · ' + r.ket : ''), dicatat_oleh: user.id, dilihat_owner: true, kas_shift_id: NOL });
  if(error){ alert('Gagal: ' + error.message); return; }
  await catatLog('Tambah Brankas', `Tambah ${fmt(r.jumlah)} ke Brankas${r.ket ? ' · ' + r.ket : ''} (lewat Pusat Kendali)`);
  muatSemua();
}
async function brankasAmbil(){
  const r = await mintaNominal('Ambil uang dari Brankas berapa?', '', true);
  if(!r) return;
  const { error } = await sb.from('brankas').insert({ jenis:'keluar', jumlah: r.jumlah, keterangan: r.ket || null, dicatat_oleh: user.id, dilihat_owner: true });
  if(error){ alert('Gagal: ' + error.message); return; }
  await catatLog('Ambil Brankas', `Ambil ${fmt(r.jumlah)} dari Brankas${r.ket ? ' · ' + r.ket : ''} (lewat Pusat Kendali)`);
  muatSemua();
}
async function catatLog(aksi, keterangan){
  try{ await sb.from('log_aktivitas').insert({ cabang_id: pilihan !== 'semua' ? pilihan : null, user_id: user.id, aksi, keterangan }); }catch(e){}
}

// ---------- kotak isi nominal: titik ribuan otomatis ----------
let _nomSelesai = null;
function formatRibuan(t){ return String(t || '').replace(/[^0-9]/g, '').replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
document.getElementById('nomInput').addEventListener('input', e => { e.target.value = formatRibuan(e.target.value); });
document.getElementById('nomInput').addEventListener('keydown', e => { if(e.key === 'Enter') tutupNom(true); if(e.key === 'Escape') tutupNom(false); });
function mintaNominal(judul, awal, pakaiKet){
  return new Promise(res => {
    _nomSelesai = res;
    document.getElementById('nomJudul').textContent = judul;
    document.getElementById('nomInput').value = awal ? formatRibuan(String(Math.round(Number(awal)))) : '';
    document.getElementById('nomKet').value = '';
    document.getElementById('nomKet').style.display = pakaiKet ? '' : 'none';
    document.getElementById('nomOverlay').classList.add('on');
    setTimeout(() => document.getElementById('nomInput').focus(), 50);
  });
}
function tutupNom(ok){
  document.getElementById('nomOverlay').classList.remove('on');
  const r = _nomSelesai; _nomSelesai = null;
  if(!r) return;
  if(!ok) return r(null);
  const jumlah = Number(document.getElementById('nomInput').value.replace(/\./g, ''));
  if(!jumlah || jumlah <= 0){ alert('Isi jumlah yang valid.'); return r(null); }
  if(!confirm(`${document.getElementById('nomJudul').textContent}\n${fmt(jumlah)} — yakin?`)) return r(null);
  r({ jumlah, ket: document.getElementById('nomKet').value.trim() });
}

mulai().catch(e => { document.getElementById('muat').textContent = 'Gagal memuat: ' + e.message; });
