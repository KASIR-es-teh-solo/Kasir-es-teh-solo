<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="app-version" content="owner-2026-10-21.1">
<title>Pusat Kendali Owner · Es Teh S.O.L.O</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
<style>
  /* Pusat Kendali Owner: halaman khusus Owner untuk memantau & mengendalikan semua cabang.
     Kerja harian (tambah stok, belanja, tutup kas, transaksi) tetap di aplikasi kasir (index.html). */
  :root{ --gold:#d4af37; --hijau:#0c1f14; --ink:#111; --merah:#c62828; --ok:#1b5e20; }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;background:#0c1f14 url(latar.jpg) center/cover fixed;}
  .wrap{max-width:980px;margin:0 auto;padding:16px 16px 40px;}
  .sh{text-shadow:0 1px 3px rgba(0,0,0,.8);}
  .atas{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .atas h1{margin:0;font-size:clamp(21px,3vw,26px);}
  .atas .tgl{font-size:13px;font-weight:700;margin-top:2px;}
  .tbl-atas{display:flex;gap:6px;flex-wrap:wrap;}
  .btn{border:2px solid var(--gold);background:#000;color:#fff;border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;cursor:pointer;}
  .btn.gold{background:var(--gold);color:var(--hijau);}
  .btn.putih{background:#fff;color:var(--hijau);border-color:#fff;}
  .btn.merah{background:#fff;color:var(--merah);border-color:#fff;}
  .cab{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .cab button{flex:1;min-width:130px;padding:11px;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;color:#fff;
    background:rgba(12,31,20,.55);border:2px solid rgba(255,255,255,.3);text-shadow:0 1px 2px rgba(0,0,0,.6);}
  .cab button.on{background:var(--gold);color:var(--hijau);border-color:var(--gold);text-shadow:none;}
  .angka{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
  .kartu{background:rgba(12,31,20,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);
    border-radius:14px;padding:12px 14px;text-shadow:0 1px 3px rgba(0,0,0,.6);}
  .kartu b{display:block;font-size:clamp(19px,2.6vw,24px);}
  .kartu small{font-weight:700;font-size:12.5px;}
  .kartu .rinci{display:block;font-size:11.5px;font-weight:600;opacity:.9;margin-top:2px;}
  .peringatan{background:#ffe08a;color:#3a2a00;border-radius:12px;padding:10px 14px;font-weight:700;margin-bottom:14px;cursor:pointer;}
  .judul{text-align:center;font-weight:800;font-size:17px;margin:6px 0 10px;}
  .menu{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .menu button{background:linear-gradient(#fffdf5,#f3ead2);color:var(--ink);border:2px solid #222;border-radius:16px;padding:16px 8px;
    text-align:center;font-weight:800;font-size:15px;cursor:pointer;}
  .menu span{display:block;font-size:32px;margin-bottom:4px;}
  .menu small{display:block;font-weight:600;font-size:11px;color:#444;margin-top:3px;}
  @media (max-width:560px){ .menu{grid-template-columns:repeat(2,1fr);} .angka{gap:6px;} .kartu{padding:10px 8px;} .kartu b{font-size:16px;} .kartu small{font-size:11px;} .kartu .rinci{display:none;} .cab button{min-width:0;font-size:13px;padding:9px 6px;} }
  .panel{display:none;}
  .panel.on{display:block;}
  .kembali{margin-bottom:12px;}
  .sec{background:#fff;color:var(--ink);border-radius:14px;padding:12px 14px;margin-bottom:12px;}
  .sec h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .baris{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #eee;font-size:14px;}
  .baris:first-of-type{border-top:0;}
  .baris small{display:block;font-size:11.5px;color:#555;font-weight:600;}
  .baris .kanan{text-align:right;white-space:nowrap;font-weight:800;}
  .min{color:var(--merah);} .plus{color:var(--ok);}
  .kosong{color:#666;font-size:13px;padding:6px 0;}
  .tabel{width:100%;border-collapse:collapse;font-size:13.5px;}
  .tabel th{text-align:left;font-size:11.5px;background:#eef3ef;padding:7px 8px;}
  .tabel td{padding:8px;border-top:1px solid #eee;}
  .tabel .r{text-align:right;white-space:nowrap;}
  .gulir{overflow-x:auto;}
  .label-cab{display:inline-block;font-size:11px;font-weight:800;background:#eef3ef;color:var(--ok);border-radius:6px;padding:1px 6px;margin-left:4px;}
  .muat{color:#fff;text-align:center;padding:40px 10px;font-weight:700;}
  /* kotak isi nominal (titik ribuan otomatis) */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:90;padding:16px;}
  .overlay.on{display:flex;}
  .modal{background:#fff;color:var(--ink);border-radius:14px;padding:18px;width:100%;max-width:380px;}
  .modal h4{margin:0 0 10px;font-size:15px;white-space:pre-line;}
  .modal input{width:100%;min-width:0;font-size:22px;font-weight:800;padding:10px;border-radius:10px;border:2px solid #ccc;margin-bottom:10px;}
  .modal .ket{font-size:14px;font-weight:600;}
  .modal .tbl{display:flex;gap:8px;margin-top:6px;}
  .modal .tbl button{flex:1;padding:11px;border-radius:10px;font-weight:800;font-size:15px;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <div id="muat" class="muat sh">Memuat Pusat Kendali…</div>
  <div id="isi" style="display:none;">
    <div class="atas">
      <div class="sh"><h1>👑 Halo, <span id="namaOwner">Boss</span></h1><div class="tgl" id="tgl"></div></div>
      <div class="tbl-atas">
        <button class="btn" onclick="muatSemua()">↻ Perbarui</button>
        <button class="btn gold" onclick="keKasir()">🛒 Buka Kasir</button>
        <button class="btn" onclick="keluar()">🚪 Keluar</button>
      </div>
    </div>
    <div class="cab" id="cabPilih"></div>

    <!-- BERANDA -->
    <div class="panel on" id="p-beranda">
      <div class="angka">
        <div class="kartu"><b id="aJual">…</b><small>Penjualan hari ini</small><span class="rinci" id="aJualRinci"></span></div>
        <div class="kartu"><b id="aKas">…</b><small id="aKasLbl">Kas semua cabang</small><span class="rinci" id="aKasRinci"></span></div>
        <div class="kartu" style="border:2px solid var(--gold);"><b id="aBrankas">…</b><small>🔒 Brankas</small></div>
      </div>
      <div class="peringatan" id="aWarn" style="display:none;" onclick="buka('stok')"></div>
      <div class="judul sh">Menu Owner</div>
      <div class="menu">
        <button onclick="buka('uang')"><span>💰</span>Uang<small>Kas · Brankas · Biaya · Laba</small></button>
        <button onclick="buka('stok')"><span>📦</span>Stok<small>Bahan · Cup · Menu</small></button>
        <button onclick="buka('menu')"><span>🍹</span>Menu &amp; Harga<small>Harga jual · Modal</small></button>
        <button onclick="buka('karyawan')"><span>👥</span>Karyawan<small>Akun · Aktif · Absen · Izin</small></button>
        <button onclick="buka('cabang')"><span>🏪</span>Cabang<small>Daftar cabang</small></button>
        <button onclick="buka('laporan')"><span>📜</span>Laporan<small>Tutup kas · Log</small></button>
      </div>
    </div>

    <div class="panel" id="p-uang"><button class="btn kembali" onclick="buka('beranda')">◀ Beranda</button><div id="uangIsi"></div></div>
    <div class="panel" id="p-stok"><button class="btn kembali" onclick="buka('beranda')">◀ Beranda</button><div id="stokIsi"></div></div>
    <div class="panel" id="p-menu"><button class="btn kembali" onclick="buka('beranda')">◀ Beranda</button><div id="menuIsi"></div></div>
    <div class="panel" id="p-karyawan"><button class="btn kembali" onclick="buka('beranda')">◀ Beranda</button><div id="karyawanIsi"></div></div>
    <div class="panel" id="p-cabang"><button class="btn kembali" onclick="buka('beranda')">◀ Beranda</button><div id="cabangIsi"></div></div>
    <div class="panel" id="p-laporan"><button class="btn kembali" onclick="buka('beranda')">◀ Beranda</button><div id="laporanIsi"></div></div>
  </div>
</div>

<div class="overlay" id="nomOverlay">
  <div class="modal">
    <h4 id="nomJudul"></h4>
    <input type="text" inputmode="numeric" id="nomInput" autocomplete="off" placeholder="0">
    <input type="text" id="nomKet" autocomplete="off" placeholder="Keterangan (boleh kosong)" style="font-size:15px;font-weight:600;">
    <div class="tbl">
      <button style="background:#fff;border:2px solid #0c1f14;color:#0c1f14;" onclick="tutupNom(false)">Batal</button>
      <button style="background:#2e7d32;border:2px solid #2e7d32;color:#fff;" onclick="tutupNom(true)">Oke</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ywoytgapbshpzrdwdtel.supabase.co";
const SUPABASE_KEY = "sb_publishable_yxfWIKFL9NbgcOZpnAqV-g_o6PhL0GK";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const BATAS_CUP = 100;
const NOL = '00000000-0000-0000-0000-000000000000';

let user = null, profil = null, cabangList = [], pilihan = 'semua', panelAktif = 'beranda';

const fmt = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jamWIB = t => new Date(t).toLocaleString('id-ID', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
const namaCab = id => { const c = cabangList.find(x => x.id === id); return c ? c.nama.replace(/^cabang\s+/i, '').replace(/\b\w/g, h => h.toUpperCase()) : '-'; };
const cabDipilih = () => pilihan === 'semua' ? cabangList : cabangList.filter(c => c.id === pilihan);
const awalHari = () => { const d = new Date(); d.setHours(0,0,0,0); return d.toISOString(); };

// ---------- masuk ----------
async function mulai(){
  document.getElementById('tgl').textContent = new Date().toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' }) + ' · Pusat Kendali Owner';
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ location.replace('index.html'); return; }
  user = session.user;
  const { data: p } = await sb.from('users').select('id, nama, role').eq('id', user.id).single();
  if(!p || p.role !== 'owner'){ location.replace('index.html?kasir=1'); return; }
  profil = p;
  document.getElementById('namaOwner').textContent = p.nama || 'Boss';
  const { data: cab } = await sb.from('cabang').select('id, nama').eq('aktif', true).order('nama');
  cabangList = cab || [];
  try{ const s = localStorage.getItem('ownerPilihCabang'); if(s && (s === 'semua' || cabangList.some(c => c.id === s))) pilihan = s; }catch(e){}
  gambarCabang();
  document.getElementById('muat').style.display = 'none';
  document.getElementById('isi').style.display = '';
  muatSemua();
}

function gambarCabang(){
  const tombol = [['semua','🌐 Semua Cabang'], ...cabangList.map(c => [c.id, (/dermo/i.test(c.nama) ? '🏠 ' : '🏪 ') + c.nama.replace(/^cabang\s+/i, '').replace(/\b\w/g, h => h.toUpperCase())])];
  document.getElementById('cabPilih').innerHTML = tombol.map(([id, lbl]) =>
    `<button class="${id === pilihan ? 'on' : ''}" onclick="pilihCabang('${id}')">${esc(lbl)}</button>`).join('');
}
function pilihCabang(id){
  pilihan = id;
  try{ localStorage.setItem('ownerPilihCabang', id); }catch(e){}
  gambarCabang();
  muatSemua();
}
function buka(p){
  panelAktif = p;
  document.querySelectorAll('.panel').forEach(el => el.classList.toggle('on', el.id === 'p-' + p));
  window.scrollTo(0, 0);
  muatPanel();
}
function muatSemua(){ muatBeranda(); if(panelAktif !== 'beranda') muatPanel(); }
function muatPanel(){
  ({ uang: muatUang, stok: muatStok, menu: muatMenu, karyawan: muatKaryawan, cabang: muatCabang, laporan: muatLaporan }[panelAktif] || (()=>{}))();
}
function keKasir(){
  // ke aplikasi kasir tanpa dilempar balik ke sini
  try{ sessionStorage.setItem('ownerKeKasir', '1'); }catch(e){}
  if(pilihan !== 'semua'){ try{ localStorage.setItem('activeCabang_' + user.id, pilihan); }catch(e){} }
  location.href = 'index.html?kasir=1';
}
async function keluar(){
  if(!confirm('Keluar dari akun Owner?')) return;
  await sb.auth.signOut();
  location.replace('index.html');
}

// ---------- hitungan uang (sama dengan aplikasi kasir) ----------
// kas cabang = uang laci sejak tutup kas terakhir (sisa + tunai − keluar laci) + saldo Kas Es Teh S.O.L.O
async function kasCabang(c){
  const { data: last } = await sb.from('kas_shift').select('kas_fisik, kas_ditinggal, waktu_tutup')
    .eq('cabang_id', c.id).order('waktu_tutup', { ascending:false }).limit(1).maybeSingle();
  const sejak = last ? last.waktu_tutup : '2000-01-01T00:00:00Z';
  const hari = awalHari();
  const [tx, by, kt, txHari, byHari] = await Promise.all([
    sb.from('transaksi').select('total').eq('cabang_id', c.id).eq('status','selesai').eq('metode_bayar','tunai').gt('created_at', sejak),
    sb.rpc('laporan_biaya_kas', { p_cabang: c.id, p_sejak: sejak }),
    sb.rpc('kas_toko_saldo', { p_cabang: c.id }),
    sb.from('transaksi').select('total, metode_bayar').eq('cabang_id', c.id).eq('status','selesai').gte('created_at', hari),
    sb.rpc('laporan_biaya_kas', { p_cabang: c.id, p_sejak: hari })
  ]);
  const jumlah = (rows, k='jumlah') => (rows || []).reduce((a, r) => a + Number(r[k] || 0), 0);
  const keluar = jumlah((by.data || []).filter(b => new Date(b.created_at) > new Date(sejak)));
  const laci = (last ? Number(last.kas_ditinggal ?? last.kas_fisik) : 0) + jumlah(tx.data, 'total') - keluar;
  const rowsHari = txHari.data || [];
  return {
    id: c.id, nama: c.nama,
    kas: laci + Number(kt.data || 0),
    jual: jumlah(rowsHari, 'total'),
    tunai: jumlah(rowsHari.filter(r => (r.metode_bayar || 'tunai') === 'tunai'), 'total'),
    online: jumlah(rowsHari.filter(r => r.metode_bayar === 'online'), 'total'),
    trx: rowsHari.length,
    keluarHari: jumlah(byHari.data),
    tutup: last ? last.waktu_tutup : null
  };
}
async function saldoBrankas(){
  const { data } = await sb.from('brankas').select('jenis, jumlah');
  return (data || []).reduce((a, r) => a + (r.jenis === 'masuk' ? 1 : -1) * Number(r.jumlah), 0);
}
async function barangHampirHabis(){
  const ids = cabDipilih().map(c => c.id);
  const hasil = [];
  try{
    const { data: cup } = await sb.rpc('laporan_stok_cup');
    (cup || []).filter(r => ids.includes(r.cabang_id) && Number(r.stok) <= BATAS_CUP)
      .forEach(r => hasil.push({ cabang: r.cabang_id, nama: r.nama, stok: Number(r.stok), satuan: 'pcs' }));
  }catch(e){}
  const { data: bh } = await sb.from('bahan_baku_stok').select('stok, cabang_id, bahan:bahan_baku_id(nama, satuan, dihitung_stok)')
    .in('cabang_id', ids.length ? ids : [NOL]).lte('stok', 0);
  (bh || []).filter(r => r.bahan && r.bahan.dihitung_stok && !/^cup/i.test(r.bahan.nama))
    .forEach(r => hasil.push({ cabang: r.cabang_id, nama: r.bahan.nama, stok: Number(r.stok), satuan: r.bahan.satuan || '' }));
  return hasil.sort((a, b) => a.stok - b.stok);
}

// ---------- beranda ----------
async function muatBeranda(){
  ['aJual','aKas','aBrankas'].forEach(id => document.getElementById(id).textContent = '…');
  document.getElementById('aKasLbl').textContent = pilihan === 'semua' ? 'Kas semua cabang' : 'Kas ' + namaCab(pilihan);
  try{
    const per = await Promise.all(cabDipilih().map(kasCabang));
    const t = k => per.reduce((a, r) => a + r[k], 0);
    document.getElementById('aJual').textContent = fmt(t('jual'));
    document.getElementById('aJualRinci').textContent = `${t('trx')} transaksi · tunai ${fmt(t('tunai'))} · online ${fmt(t('online'))}`;
    document.getElementById('aKas').textContent = fmt(t('kas'));
    document.getElementById('aKasRinci').textContent = `Penjualan ${fmt(t('tunai'))} · Pengeluaran ${fmt(t('keluarHari'))}`;
  }catch(e){ document.getElementById('aJual').textContent = '-'; document.getElementById('aKas').textContent = '-'; }
  try{ document.getElementById('aBrankas').textContent = fmt(await saldoBrankas()); }catch(e){ document.getElementById('aBrankas').textContent = '-'; }
  try{
    const habis = await barangHampirHabis();
    const w = document.getElementById('aWarn');
    w.style.display = habis.length ? '' : 'none';
    w.textContent = `⚠️ ${habis.length} barang hampir habis: ` + habis.slice(0, 3).map(h => `${h.nama} ${h.stok}`).join(' · ') + (habis.length > 3 ? ' …' : '') + ' — ketuk untuk lihat';
  }catch(e){}
}

// ---------- uang ----------
async function muatUang(){
  const box = document.getElementById('uangIsi');
  box.innerHTML = '<div class="muat sh">Memuat…</div>';
  const cabs = cabDipilih();
  const [per, saldo, riwayat, online, laba, biaya] = await Promise.all([
    Promise.all(cabs.map(kasCabang)),
    saldoBrankas(),
    sb.from('brankas').select('jenis, jumlah, keterangan, created_at, cabang_id, pencatat:dicatat_oleh(nama)').order('created_at', { ascending:false }).limit(30),
    Promise.all(cabs.map(c => sb.rpc('brankas_online_data', { p_cabang: c.id }).then(r => ({ c, d: r.data || {} })))),
    Promise.all(cabs.map(c => sb.rpc('laba_bersih', { p_cabang: c.id, p_hari: 30 }).then(r => ({ c, d: r.data })))),
    sb.from('biaya_operasional').select('kategori, deskripsi, jumlah, sumber_dana, created_at, cabang_id, pencatat:dicatat_oleh(nama)')
      .in('cabang_id', cabs.map(c => c.id).concat(NOL)).gte('created_at', new Date(Date.now() - 7*864e5).toISOString())
      .order('created_at', { ascending:false }).limit(60)
  ]);
  const tot = k => per.reduce((a, r) => a + r[k], 0);
  const n = (d, k) => Number((d || {})[k] || 0);
  const labaDari = d => d ? (n(d,'omzet') - n(d,'modal')) - (n(d,'gaji') + n(d,'sewa') + n(d,'listrik') + n(d,'galon') + n(d,'gas') + n(d,'kresek')) : 0;
  box.innerHTML = `
    <div class="sec"><h3>🏪 Kas & penjualan hari ini</h3><div class="gulir"><table class="tabel">
      <tr><th>Cabang</th><th class="r">Kas</th><th class="r">Penjualan</th><th class="r">Pengeluaran</th><th class="r">Trx</th><th>Tutup kas terakhir</th></tr>
      ${per.map(r => `<tr><td><b>${esc(namaCab(r.id))}</b></td><td class="r"><b>${fmt(r.kas)}</b></td><td class="r">${fmt(r.jual)}</td><td class="r">${fmt(r.keluarHari)}</td><td class="r">${r.trx}</td><td>${r.tutup ? jamWIB(r.tutup) : 'belum pernah'}</td></tr>`).join('')}
      ${per.length > 1 ? `<tr style="background:#f6f6f6"><td><b>TOTAL</b></td><td class="r"><b>${fmt(tot('kas'))}</b></td><td class="r"><b>${fmt(tot('jual'))}</b></td><td class="r"><b>${fmt(tot('keluarHari'))}</b></td><td class="r"><b>${tot('trx')}</b></td><td></td></tr>` : ''}
    </table></div></div>

    <div class="sec"><h3><span>🔒 Brankas: ${fmt(saldo)}</span><span><button class="btn putih" style="border-color:#1b5e20;color:#1b5e20" onclick="brankasTambah()">+ Tambah Uang</button>
      <button class="btn merah" style="border-color:#c62828" onclick="brankasAmbil()">− Ambil</button></span></h3>
      ${(riwayat.data || []).map(r => `<div class="baris"><span>${r.jenis === 'masuk' ? '⬇️' : '⬆️'} ${esc(r.keterangan || (r.jenis === 'masuk' ? 'Masuk' : 'Ambil'))}
        <small>${jamWIB(r.created_at)} · ${esc((r.pencatat && r.pencatat.nama) || '-')}${r.cabang_id ? ' · ' + esc(namaCab(r.cabang_id)) : ''}</small></span>
        <span class="kanan ${r.jenis === 'masuk' ? 'plus' : 'min'}">${r.jenis === 'masuk' ? '+' : '−'} ${fmt(r.jumlah)}</span></div>`).join('') || '<div class="kosong">Belum ada catatan.</div>'}
    </div>

    <div class="sec"><h3>🛵 Brankas Online (Grab / Shopee, belum cair)</h3>

// ---------- stok (cuma lihat; tambah stok tetap di aplikasi kasir oleh Admin) ----------
async function muatStok(){
  const box = document.getElementById('stokIsi');
  box.innerHTML = '<div class="muat sh">Memuat…</div>';
  const cabs = cabDipilih();
  let cup = [];
  try{ const r = await sb.rpc('laporan_stok_cup'); cup = r.data || []; }catch(e){}
  const bahan = await Promise.all(cabs.map(c => sb.from('bahan_baku_stok')
    .select('stok, bahan:bahan_baku_id(nama, satuan, dihitung_stok)').eq('cabang_id', c.id).then(r => ({ c, rows: (r.data || []).filter(x => x.bahan && x.bahan.dihitung_stok) }))));
  box.innerHTML = cabs.map(c => {
    const cupC = cup.filter(r => r.cabang_id === c.id);
    const bh = (bahan.find(b => b.c.id === c.id) || { rows: [] }).rows.filter(r => !/^cup/i.test(r.bahan.nama)).sort((a, b) => a.stok - b.stok);
    return `<div class="sec"><h3>🏪 ${esc(namaCab(c.id))}</h3>
      <div style="font-weight:800;font-size:13px;margin:4px 0;">🥤 Cup</div>
      ${cupC.map(r => { const perHari = Number(r.pakai_7hari || 0) / Math.max(1, Number(r.hari_data || 1)); const hari = perHari > 0 ? Math.floor(Number(r.stok) / perHari) : null;
        return `<div class="baris"><span>${esc(r.nama)}<small>${perHari > 0 ? `pakai ±${Math.round(perHari)}/hari · cukup ±${hari} hari` : 'belum ada pemakaian'}</small></span><span class="kanan ${Number(r.stok) <= BATAS_CUP ? 'min' : ''}">${Number(r.stok)} pcs</span></div>`; }).join('') || '<div class="kosong">Belum ada data cup.</div>'}
      <div style="font-weight:800;font-size:13px;margin:10px 0 4px;">📦 Bahan baku</div>
      ${bh.map(r => `<div class="baris"><span>${esc(r.bahan.nama)}</span><span class="kanan ${Number(r.stok) <= 0 ? 'min' : ''}">${Number(r.stok).toLocaleString('id-ID')} ${esc(r.bahan.satuan || '')}</span></div>`).join('') || '<div class="kosong">Belum ada data bahan.</div>'}
    </div>`;

// ---------- menu & harga ----------
async function muatMenu(){
  const box = document.getElementById('menuIsi');
  box.innerHTML = '<div class="muat sh">Memuat…</div>';
  const cabs = cabDipilih();
  const hasil = await Promise.all(cabs.map(c => sb.from('produk')
    .select('id, nama, aktif, tipe_harga, harga_kecil, harga_besar, harga_modal_kecil, harga_modal_besar, kategori:kategori_id(nama), produk_varian(label, harga, harga_modal, urutan)')
    .eq('cabang_id', c.id).order('nama').then(r => ({ c, rows: r.data || [] }))));
  box.innerHTML = hasil.map(({ c, rows }) => `<div class="sec"><h3>🍹 ${esc(namaCab(c.id))} <small style="font-weight:600;color:#555;">${rows.filter(p => p.aktif).length} menu aktif · ketuk harga untuk ubah</small></h3>
    ${rows.map(p => {
      const harga = p.tipe_harga === 'varian'
        ? (p.produk_varian || []).slice().sort((a, b) => a.urutan - b.urutan).map(v => `${esc(v.label)} ${fmt(v.harga)}`).join(' · ')
        : `<a href="#" onclick="ubahHarga('${p.id}','kecil',${Number(p.harga_kecil)});return false;">Kecil ${fmt(p.harga_kecil)}</a> · <a href="#" onclick="ubahHarga('${p.id}','besar',${Number(p.harga_besar)});return false;">Besar ${fmt(p.harga_besar)}</a>`;
      const modal = p.tipe_harga === 'varian' ? '' : `modal ${fmt(p.harga_modal_kecil)} / ${fmt(p.harga_modal_besar)}`;
      return `<div class="baris"><span>${esc(p.nama)}${p.aktif ? '' : ' <span class="label-cab" style="color:#c62828">nonaktif</span>'}<small>${esc((p.kategori && p.kategori.nama) || '')}${modal ? ' · ' + modal : ''}</small></span><span class="kanan" style="font-weight:700;">${harga}</span></div>`;
    }).join('') || '<div class="kosong">Belum ada menu.</div>'}
  </div>`).join('') + '<div class="sec" style="font-size:13px;">ℹ️ Tambah menu baru, resep, dan SOP: buka lewat tombol 🛒 Buka Kasir → Pengaturan (sementara, sampai dipindah ke sini).</div>';
}
async function ubahHarga(id, ukuran, lama){
  const r = await mintaNominal(`Harga jual ukuran ${ukuran} baru:`, lama, false);
  if(!r) return;
  const kolom = ukuran === 'besar' ? 'harga_besar' : 'harga_kecil';
  const { error } = await sb.from('produk').update({ [kolom]: r.jumlah }).eq('id', id);
  if(error){ alert('Gagal: ' + error.message); return; }
  await catatLog('Ubah Harga', `Harga ${ukuran} diubah ${fmt(lama)} → ${fmt(r.jumlah)} (lewat Pusat Kendali)`);
  muatMenu();
}

async function muatKaryawan(){
  const box = document.getElementById('karyawanIsi');
  box.innerHTML = '<div class="muat sh">Memuat…</div>';
  const ids = cabDipilih().map(c => c.id);
  const semua = pilihan === 'semua';
  let qAbs = sb.from('absensi').select('waktu_masuk, waktu_keluar, terverifikasi, jarak_meter, cabang_id, user:user_id(nama)').gte('waktu_masuk', new Date(Date.now() - 2*864e5).toISOString()).order('waktu_masuk', { ascending:false }).limit(40);
  let qIzin = sb.from('izin_keluar').select('alasan, waktu_mulai, waktu_selesai, status, cabang_id, user:user_id(nama)').order('waktu_mulai', { ascending:false }).limit(15);
  if(!semua){ qAbs = qAbs.eq('cabang_id', pilihan); qIzin = qIzin.eq('cabang_id', pilihan); }
  const [us, uc, aktif, abs, izin] = await Promise.all([
    sb.from('users').select('id, nama, role, cabang_id').order('role'),
    sb.from('user_cabang').select('user_id, cabang_id'),
    sb.from('user_presence').select('user_id, cabang_id, last_seen_at, user:user_id(nama, role)').order('last_seen_at', { ascending:false }),
    qAbs, qIzin
  ]);
  const cabUser = {};
  (uc.data || []).forEach(r => (cabUser[r.user_id] = cabUser[r.user_id] || []).push(r.cabang_id));
  const akun = (us.data || []).filter(u => u.role !== 'owner').filter(u => semua || u.cabang_id === pilihan || (cabUser[u.id] || []).includes(pilihan));
  const peran = { admin:'Admin', kasir:'Kasir' };
  const aktifRows = (aktif.data || []).filter(a => semua || a.cabang_id === pilihan);
  box.innerHTML = `
    <div class="sec"><h3>🟢 Aktif sekarang</h3>
      ${aktifRows.map(a => `<div class="baris"><span>${esc((a.user && a.user.nama) || '-')}<small>${esc(peran[(a.user || {}).role] || '')} · ${esc(namaCab(a.cabang_id))}</small></span><span class="kanan" style="font-weight:600;">terakhir ${jamWIB(a.last_seen_at)}</span></div>`).join('') || '<div class="kosong">Tidak ada yang aktif.</div>'}
    </div>
    <div class="sec"><h3>👥 Akun karyawan</h3>
      ${akun.map(u => `<div class="baris"><span>${esc(u.nama)}<small>${esc(peran[u.role] || u.role)} · ${esc(((cabUser[u.id] && cabUser[u.id].length) ? cabUser[u.id] : [u.cabang_id]).filter(Boolean).map(namaCab).join(', ') || 'belum ada cabang')}</small></span></div>`).join('') || '<div class="kosong">Belum ada akun karyawan di cabang ini.</div>'}
      <div class="kosong">Tambah akun / reset password: lewat 🛒 Buka Kasir → Profil → Karyawan (sementara).</div>
    </div>
    <div class="sec"><h3>🕒 Absen 2 hari terakhir</h3>
      ${(abs.data || []).map(a => `<div class="baris"><span>${esc((a.user && a.user.nama) || '-')}<small>${esc(namaCab(a.cabang_id))}${a.terverifikasi === false ? ' · ⚠️ belum terverifikasi' : ''}${a.jarak_meter != null ? ' · ' + Math.round(a.jarak_meter) + ' m' : ''}</small></span><span class="kanan" style="font-weight:600;">${jamWIB(a.waktu_masuk)} → ${a.waktu_keluar ? new Date(a.waktu_keluar).toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' }) : 'masih kerja'}</span></div>`).join('') || '<div class="kosong">Belum ada absen.</div>'}
    </div>
    <div class="sec"><h3>🚶 Izin keluar terbaru</h3>
      ${(izin.data || []).map(z => `<div class="baris"><span>${esc((z.user && z.user.nama) || '-')} · ${esc(z.alasan || '')}<small>${esc(namaCab(z.cabang_id))} · ${jamWIB(z.waktu_mulai)}${z.waktu_selesai ? ' → ' + new Date(z.waktu_selesai).toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' }) : ''}</small></span><span class="kanan" style="font-weight:600;">${esc(z.status || '')}</span></div>`).join('') || '<div class="kosong">Belum ada izin.</div>'}

}

// ---------- kotak isi nominal: titik ribuan otomatis ----------
let _nomSelesai = null;
function formatRibuan(t){ return String(t || '').replace(/[^0-9]/g, '').replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
document.getElementById('nomInput').addEventListener('input', e => { e.target.value = formatRibuan(e.target.value); });
document.getElementById('nomInput').addEventListener('keydown', e => { if(e.key === 'Enter') tutupNom(true); if(e.key === 'Escape') tutupNom(false); });
function mintaNominal(judul, awal, pakaiKet){
  return new Promise(res => {
    _nomSelesai = res;
    document.getElementById('nomJudul').textContent = judul;
    document.getElementById('nomInput').value = awal ? formatRibuan(String(Math.round(Number(awal)))) : '';
    document.getElementById('nomKet').value = '';
    document.getElementById('nomKet').style.display = pakaiKet ? '' : 'none';
    document.getElementById('nomOverlay').classList.add('on');
    setTimeout(() => document.getElementById('nomInput').focus(), 50);
  });
}
function tutupNom(ok){
  document.getElementById('nomOverlay').classList.remove('on');
  const r = _nomSelesai; _nomSelesai = null;
  if(!r) return;
  if(!ok) return r(null);
  const jumlah = Number(document.getElementById('nomInput').value.replace(/\./g, ''));
  if(!jumlah || jumlah <= 0){ alert('Isi jumlah yang valid.'); return r(null); }
  if(!confirm(`${document.getElementById('nomJudul').textContent}\n${fmt(jumlah)} — yakin?`)) return r(null);
  r({ jumlah, ket: document.getElementById('nomKet').value.trim() });
}

mulai().catch(e => { document.getElementById('muat').textContent = 'Gagal memuat: ' + e.message; });
