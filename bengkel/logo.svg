<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="o" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb35c"/><stop offset="1" stop-color="#d9660f"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3038"/><stop offset="1" stop-color="#121519"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="230" r="150" fill="none" stroke="url(#o)" stroke-width="14"/>
  <!-- roda gigi -->
  <g transform="translate(256 230)" fill="url(#o)">
    <g id="gg">
      <rect x="-16" y="-112" width="32" height="34" rx="6"/>
    </g>
    <use href="#gg" transform="rotate(45)"/><use href="#gg" transform="rotate(90)"/><use href="#gg" transform="rotate(135)"/>
    <use href="#gg" transform="rotate(180)"/><use href="#gg" transform="rotate(225)"/><use href="#gg" transform="rotate(270)"/><use href="#gg" transform="rotate(315)"/>
    <circle r="86"/>
    <circle r="62" fill="#1a1e23"/>
  </g>
  <!-- kunci pas menyilang -->
  <defs><mask id="m"><rect x="-200" y="-200" width="400" height="400" fill="#fff"/>
    <rect x="-17" y="-190" width="34" height="62" fill="#000"/>
    <circle cx="0" cy="118" r="20" fill="#000"/></mask></defs>
  <g transform="translate(256 230) rotate(45)">
    <g mask="url(#m)" stroke="#121519" stroke-width="10" paint-order="stroke" fill="#f4f6f8">
      <rect x="-19" y="-110" width="38" height="220" rx="12"/>
      <circle cx="0" cy="-122" r="44"/>
      <circle cx="0" cy="118" r="38"/>
    </g>
    <g mask="url(#m)" fill="#f4f6f8">
      <rect x="-19" y="-110" width="38" height="220" rx="12"/>
      <circle cx="0" cy="-122" r="44"/>
      <circle cx="0" cy="118" r="38"/>
    </g>
  </g>
  <text x="256" y="440" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="64" fill="#f4f6f8" letter-spacing="6">LJM</text>
</svg>
