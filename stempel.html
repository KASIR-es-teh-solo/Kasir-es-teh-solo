<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1f14">
<meta name="color-scheme" content="only light">
<title>Stempel Es Teh S.O.L.O</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' rx='40' fill='%230c1f14'/%3E%3Ccircle cx='100' cy='100' r='80' fill='%23f7f4ea'/%3E%3Ctext x='100' y='135' font-size='100' text-anchor='middle'%3E%F0%9F%8C%B2%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
<style>
:root{--hijau:#0c1f14;--h2:#2e7d32;--krem:#f7f4ea;--emas:#e8b923;--teks:#1d2a21;--abu:#5b6b60;--garis:#cfd8c9}
*{box-sizing:border-box}
html{background:#0c1f14}
body{margin:0;min-height:100vh;background:#0c1f14 url('latar.jpg') center/cover fixed no-repeat;color:var(--teks);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.atas{background:rgba(12,31,20,.82);color:#fff;text-align:center;padding:26px 16px 20px;backdrop-filter:blur(3px)}
.atas.emas{background:rgba(232,185,35,.95);color:var(--hijau)}
.atas .ik{font-size:34px;line-height:1}
.atas h1{font-family:Fraunces,serif;font-size:22px;margin:6px 0 0}
.isi{max-width:440px;margin:16px auto 30px;width:calc(100% - 32px);background:rgba(247,244,234,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.35);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.3);padding:18px 16px 24px;display:flex;flex-direction:column;gap:14px;text-align:center}
.kecil{font-size:14px;color:var(--abu);line-height:1.5}
.btn{background:var(--h2);color:#fff;border:none;border-radius:14px;padding:15px;font-weight:800;font-size:17px;width:100%;font-family:inherit;cursor:pointer}
.btn:disabled{opacity:.6}
.btn.emas{background:var(--emas);color:var(--hijau)}
.link{background:none;border:none;color:var(--h2);text-decoration:underline;font-size:15px;font-family:inherit;padding:6px;cursor:pointer}
input{border:2px solid var(--garis);border-radius:12px;padding:14px;font-size:17px;font-family:inherit;width:100%;background:#fff}
input:focus{outline:none;border-color:var(--h2)}
.kartu{background:rgba(255,255,255,.78);border-radius:18px;padding:16px;border:1px solid rgba(255,255,255,.6)}
.isi>.kecil,.isi>b,.isi>.big,.isi>.jumlah{text-shadow:0 1px 2px rgba(255,255,255,.6)}
.scan-ov{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;text-align:center;padding:16px}
.scan-ov video{width:100%;max-width:420px;border-radius:18px;background:#111}
.scan-kotak{position:relative;width:100%;max-width:420px}
.scan-kotak::after{content:'';position:absolute;inset:18%;border:3px solid var(--emas);border-radius:16px}
.pesanan b{display:block;font-size:26px;margin:4px 0}
.big{font-family:Fraunces,serif;font-size:38px;color:var(--h2);margin:0}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:4px 0}
.c{aspect-ratio:1;border-radius:50%;border:2px dashed #9bb3a0;display:flex;align-items:center;justify-content:center;font-size:22px}
.c.on{border:none;background:var(--h2)}
.c.baru{border:none;background:var(--emas);animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.jumlah{font-size:24px;font-weight:800}
.err{border-color:#f0c9c4}.err.kuning{border-color:#f1dfa6}
.err .ik{font-size:32px}
.kode{border:2px dashed var(--emas)}
.kode .angka{font-size:46px;font-weight:900;letter-spacing:8px;color:var(--hijau)}
input::placeholder{letter-spacing:normal}
.isi .kecil{color:#24312a;font-weight:600}
.salah{color:#c0392b;font-size:14px;min-height:1em}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="atas" id="atas"><div class="ik" id="atasIkon">🌲</div><h1 id="atasJudul">Stempel Es Teh S.O.L.O</h1></div>
<div class="isi" id="isi"><p class="kecil">Memuat…</p></div>

<script>
const SUPABASE_URL = "https://ywoytgapbshpzrdwdtel.supabase.co";
const SUPABASE_KEY = "sb_publishable_yxfWIKFL9NbgcOZpnAqV-g_o6PhL0GK";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession:false, autoRefreshToken:false } });
let CABANG = new URLSearchParams(location.search).get('c') || '199e77b5-f52e-4534-9656-3a0d8fceddfd';
// QR di meja kasir berisi kode rahasia (?k=...). Kode disimpan 10 menit lalu dihapus dari alamat halaman,
// jadi pintasan di layar HP / halaman tanpa scan hanya bisa MELIHAT kartu, tidak bisa ambil stempel.
(function(){
  const k = new URLSearchParams(location.search).get('k');
  if(k){
    try{ sessionStorage.setItem('stempel_kode', JSON.stringify({ k, t: Date.now() })); }catch(e){}
    try{ history.replaceState(null, '', location.pathname); }catch(e){}
  }
})();
function kodeQR(){
  try{ const o = JSON.parse(sessionStorage.getItem('stempel_kode') || 'null'); if(o && Date.now() - o.t < 10*60*1000) return o.k; }catch(e){}
  return null;
}
let cabangSudahDicek = false;
async function cabangDariQR(){
  if(cabangSudahDicek || !kodeQR()) return;
  const { data } = await sb.rpc('stempel_cabang_dari_kode', { p_kode: kodeQR() });
  if(data) CABANG = data;
  cabangSudahDicek = true;
}
function ambilLokasi(){
  return new Promise((res, rej) => {
    if(!navigator.geolocation) return rej({ code: 2 });
    navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
  });
}
const KUNCI = 'stempel_es_teh_solo_token';

function bacaToken(){ try{ return localStorage.getItem(KUNCI); }catch(e){ return null; } }
function simpanToken(t){ try{ localStorage.setItem(KUNCI, t); }catch(e){} }
function hapusToken(){ try{ localStorage.removeItem(KUNCI); }catch(e){} }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isi = () => document.getElementById('isi');
function atas(judul, ikon='🌲', emas=false){
  document.getElementById('atasJudul').textContent = judul;
  document.getElementById('atasIkon').textContent = ikon;
  document.getElementById('atas').classList.toggle('emas', emas);
}
function pesanError(e){
  const m = (e && (e.message || e.details)) || String(e || '');
  return m.replace(/^.*?ERROR:\s*/,'') || 'Gagal, coba lagi ya.';
}
function gridStempel(n, baru=0){
  const penuh = Math.min(n, 10);
  let h = '<div class="grid">';
  for(let i=0;i<10;i++){
    const on = i < penuh, b = on && i >= penuh - baru;
    h += `<div class="c ${on ? (b ? 'baru' : 'on') : ''}">${on ? '🧋' : (i === 9 ? '🎁' : '')}</div>`;
  }
  return h + '</div>';
}
function kartuStatus(st, baru=0){
  const n = st.stempel || 0;
  let h = gridStempel(n, baru) + `<div class="jumlah">${Math.min(n,10)} / 10${n >= 10 ? ' 🎉' : ''}</div>`;
  if(n < 10) h += `<div class="kecil">Tinggal <b>${10 - n} lagi</b> dapat 1 Es Teh Original besar GRATIS!</div>`;
  if(st.hadiah_kode){
    h += `<div class="kartu kode"><div class="kecil">Tunjukkan kode ini ke kasir</div><div class="angka">${esc(st.hadiah_kode)}</div><div class="kecil">Berlaku sampai hari ini 23.59 · tukar dengan 1 Es Teh Original besar GRATIS</div></div>`;
  }
  return h;
}

// ---------- daftar & pulihkan ----------
function tampilDaftar(){
  atas('Stempel Es Teh S.O.L.O');
  isi().innerHTML = `
    <div style="font-size:44px;margin-top:4px">👋</div>
    <b style="font-size:21px">Daftar dulu, cukup sekali</b>
    <div class="kecil">Beli Es Teh Original <b>besar</b> → scan → dapat stempel.<br>10 stempel = <b>GRATIS 1 Original besar</b>.</div>
    <input id="fNama" placeholder="Nama kamu" autocomplete="given-name" maxlength="30">
    <input id="fWa" placeholder="Nomor WA, mis. 0812 3456 7890" inputmode="tel" autocomplete="tel" maxlength="18">
    <input id="fPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="Buat PIN 4 angka" autocomplete="off" style="letter-spacing:8px;text-align:center">
    <div class="kecil" style="margin-top:-6px">🔑 PIN dipakai kalau pindah HP. Jangan kasih tahu orang lain.</div>
    <div class="salah" id="fSalah"></div>
    <button class="btn" id="fBtn" onclick="kirimDaftar()">Daftar & lanjut ✅</button>
    <div class="kecil">Nomor WA dipakai untuk memulihkan stempel kalau ganti HP. Tidak dikirimi spam.</div>
    <button class="link" onclick="tampilPulihkan()">Sudah pernah daftar? Pulihkan stempel</button>`;
}
function tampilPulihkan(){
  atas('Pulihkan Stempel', '📲');
  isi().innerHTML = `
    <b style="font-size:21px">Sudah pernah daftar?</b>
    <div class="kecil">Masukkan nama, nomor WA & PIN yang dulu dibuat</div>
    <input id="fNama" placeholder="Nama (sama seperti saat daftar)" maxlength="30">
    <input id="fWa" placeholder="Nomor WA" inputmode="tel" maxlength="18">
    <input id="fPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="PIN 4 angka" autocomplete="off" style="letter-spacing:8px;text-align:center">
    <div class="kecil" style="margin-top:-6px">Lupa PIN? Minta kasir buatkan PIN baru.</div>
    <div class="salah" id="fSalah"></div>
    <button class="btn" id="fBtn" onclick="kirimPulihkan()">Pulihkan stempel</button>
    <button class="link" onclick="tampilDaftar()">← Daftar baru</button>`;
}
async function kirimForm(fungsi, args){
  const btn = document.getElementById('fBtn'), salah = document.getElementById('fSalah');
  salah.textContent = ''; btn.disabled = true;
  const { data, error } = await sb.rpc(fungsi, args);
  btn.disabled = false;
  if(error){ salah.textContent = pesanError(error); return; }
  if(data && data.error){ salah.textContent = data.error; return; }
  simpanToken(data.token);
  mulai();
}
function kirimDaftar(){
  kirimForm('stempel_daftar_pin', { p_nama: document.getElementById('fNama').value, p_wa: document.getElementById('fWa').value, p_pin: document.getElementById('fPin').value, p_cabang: CABANG });
}
function kirimPulihkan(){
  kirimForm('stempel_pulihkan_pin', { p_nama: document.getElementById('fNama').value, p_wa: document.getElementById('fWa').value, p_pin: document.getElementById('fPin').value });
}

// ---------- alur utama ----------
let pesananSiap = null, statusSaya = null;
async function mulai(){
  const token = bacaToken();
  if(!token){ tampilDaftar(); return; }
  isi().innerHTML = '<p class="kecil">Memuat…</p>';
  await cabangDariQR();
  const [st, ck] = await Promise.all([
    sb.rpc('stempel_status', { p_token: token }),
    sb.rpc('stempel_cek', { p_token: token, p_cabang: CABANG })
  ]);
  if(st.error || ck.error){ tampilGagal(pesanError(st.error || ck.error)); return; }
  if(!st.data.terdaftar){ hapusToken(); tampilDaftar(); return; }
  statusSaya = st.data;
  if(st.data.punya_pin === false){ tampilBuatPin(); return; }
  const c = ck.data;
  if(!kodeQR()){ tampilKartuSaja(); return; }
  if(c.ada){ pesananSiap = c; tampilPesanan(); return; }
  tampilAlasan(c);
}
function tampilBuatPin(){
  atas('Hai, ' + statusSaya.nama + '!', '🔑');
  isi().innerHTML = `
    <b style="font-size:21px">Buat PIN dulu ya</b>
    <div class="kecil">Supaya stempelmu aman. PIN dipakai kalau kamu pindah HP.</div>
    <input id="fPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="PIN 4 angka" autocomplete="off" style="letter-spacing:8px;text-align:center">
    <input id="fPin2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="Ulangi PIN" autocomplete="off" style="letter-spacing:8px;text-align:center">
    <div class="salah" id="fSalah"></div>
    <button class="btn" id="fBtn" onclick="simpanPinBaru()">Simpan PIN 🔑</button>`;
}
async function simpanPinBaru(){
  const a = document.getElementById('fPin').value, b = document.getElementById('fPin2').value, salah = document.getElementById('fSalah');
  if(a !== b){ salah.textContent = 'PIN tidak sama, ulangi ya.'; return; }
  const btn = document.getElementById('fBtn'); btn.disabled = true;
  const { error } = await sb.rpc('stempel_set_pin', { p_token: bacaToken(), p_pin: a });
  btn.disabled = false;
  if(error){ salah.textContent = pesanError(error); return; }
  mulai();
}
function tampilKartuSaja(){
  const st = statusSaya, penuh = st.stempel >= 10;
  atas(penuh ? 'Selamat, ' + st.nama + '!' : 'Hai, ' + st.nama + '!', penuh ? '🎁' : '🌲', penuh);
  isi().innerHTML = `<div class="kartu">${kartuStatus(st)}</div>
    <div class="kartu err kuning"><b>Mau ambil stempel?</b><div class="kecil" style="margin:4px 0 10px">Setelah bayar Es Teh Original besar, scan QR di meja kasir.</div>
    <button class="btn" onclick="bukaScanner()">📷 Scan QR di meja kasir</button></div>`;
}
// ---------- scanner QR di dalam halaman ----------
let scanStream = null, scanJalan = false;
function muatJsQR(){
  return new Promise((res, rej) => {
    if(window.jsQR) return res();
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js'; sc.onload = res; sc.onerror = rej;
    document.head.appendChild(sc);
  });
}
async function bukaScanner(){
  const ov = document.createElement('div'); ov.className = 'scan-ov'; ov.id = 'scanOv';
  ov.innerHTML = `<b style="font-size:19px">Arahkan kamera ke QR di meja kasir</b>
    <div class="scan-kotak"><video id="scanVideo" playsinline muted></video></div>
    <div class="kecil" id="scanInfo" style="color:#ddd">Membuka kamera…</div>
    <button class="btn emas" style="max-width:420px" onclick="tutupScanner()">Batal</button>`;
  document.body.appendChild(ov);
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
  }catch(e){
    document.getElementById('scanInfo').textContent = 'Kamera tidak bisa dibuka. Izinkan Kamera untuk halaman ini, atau scan pakai aplikasi kamera HP.';
    return;
  }
  const v = document.getElementById('scanVideo'); v.srcObject = scanStream; await v.play();
  document.getElementById('scanInfo').textContent = 'Mencari QR…';
  let det = null;
  try{ if('BarcodeDetector' in window) det = new BarcodeDetector({ formats: ['qr_code'] }); }catch(e){ det = null; }
  if(!det){ try{ await muatJsQR(); }catch(e){} }
  const kanvas = document.createElement('canvas'), ctx = kanvas.getContext('2d', { willReadFrequently: true });
  scanJalan = true;
  const cari = async () => {
    if(!scanJalan) return;
    let teks = null;
    try{
      if(det){ const h = await det.detect(v); if(h.length) teks = h[0].rawValue; }
      else if(window.jsQR && v.videoWidth){
        kanvas.width = v.videoWidth; kanvas.height = v.videoHeight; ctx.drawImage(v, 0, 0);
        const r = jsQR(ctx.getImageData(0, 0, kanvas.width, kanvas.height).data, kanvas.width, kanvas.height);
        if(r) teks = r.data;
      }
    }catch(e){}
    if(teks){
      let k = null;
      try{ k = new URL(teks).searchParams.get('k'); }catch(e){}
      if(k){
        try{ sessionStorage.setItem('stempel_kode', JSON.stringify({ k, t: Date.now() })); }catch(e){}
        cabangSudahDicek = false; tutupScanner(); mulai(); return;
      }
      document.getElementById('scanInfo').textContent = 'Itu bukan QR stempel Es Teh S.O.L.O 🙏';
    }
    setTimeout(cari, 250);
  };
  cari();
}
function tutupScanner(){
  scanJalan = false;
  if(scanStream){ scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
  const ov = document.getElementById('scanOv'); if(ov) ov.remove();
}
function tampilGagal(msg){
  atas('Stempel Es Teh S.O.L.O');
  isi().innerHTML = `<div class="kartu err"><div class="ik">📶</div><b>Gagal memuat</b><div class="kecil">${esc(msg)}</div></div><button class="btn" onclick="mulai()">Coba lagi</button>`;
}
function tampilPesanan(){
  const p = pesananSiap;
  atas('Hai, ' + statusSaya.nama + '!', '🧋');
  isi().innerHTML = `
    <div class="kecil">Pesananmu barusan:</div>
    <div class="kartu pesanan"><b>🧋 ${p.jumlah} Original besar</b><div class="kecil">dibayar ${esc(p.jam)} · = ${p.jumlah} stempel</div></div>
    <button class="btn" id="ambilBtn" onclick="ambilStempel()">Ambil ${p.jumlah} stempel ✅</button>
    <div class="kecil">📍 Butuh izin lokasi untuk memastikan kamu ada di outlet.</div>
    <div class="salah" id="ambilSalah"></div>
    <div class="kecil">Bukan pesananmu? Jangan diambil ya, nanti dibatalkan kasir 🙏</div>
    <div class="kecil" style="margin-top:8px">Stempelmu sekarang: <b>${Math.min(statusSaya.stempel,10)} / 10</b></div>`;
}
async function ambilStempel(){
  const btn = document.getElementById('ambilBtn'), salah = document.getElementById('ambilSalah');
  btn.disabled = true; btn.textContent = 'Cek lokasi…'; salah.textContent = '';
  let pos;
  try{ pos = await ambilLokasi(); }
  catch(e){
    btn.disabled = false; btn.textContent = `Ambil ${pesananSiap.jumlah} stempel ✅`;
    salah.textContent = e && e.code === 1
      ? 'Izin lokasi ditolak. Izinkan Lokasi untuk halaman ini (ikon gembok di atas → Izin → Lokasi), lalu coba lagi.'
      : 'Lokasi belum terbaca. Nyalakan GPS/Lokasi HP, lalu coba lagi.';
    return;
  }
  btn.textContent = 'Mengambil…';
  const { data, error } = await sb.rpc('stempel_klaim', { p_token: bacaToken(), p_transaksi: pesananSiap.transaksi_id,
    p_kode: kodeQR(), p_lat: pos.coords.latitude, p_lng: pos.coords.longitude, p_akurasi: pos.coords.accuracy });
  if(error){
    btn.disabled = false; btn.textContent = `Ambil ${pesananSiap.jumlah} stempel ✅`;
    document.getElementById('ambilSalah').textContent = pesanError(error);
    return;
  }
  statusSaya = data;
  const penuh = data.stempel >= 10;
  atas(penuh ? 'Selamat, ' + data.nama + '!' : 'Hai, ' + data.nama + '!', penuh ? '🎁' : '🎉', penuh);
  isi().innerHTML = `<p class="big">+${data.tambah} stempel</p><div class="kecil">dari ${data.tambah} Es Teh Original besar</div>` +
    kartuStatus(data, Math.min(data.tambah, data.stempel)) +
    `<div class="kecil" style="margin-top:8px">💡 Simpan halaman ini di layar utama HP biar gampang cek stempel.</div>`;
}
function tampilAlasan(c){
  const st = statusSaya, penuh = st.stempel >= 10;
  atas(penuh ? 'Selamat, ' + st.nama + '!' : 'Hai, ' + st.nama + '!', penuh ? '🎁' : '🌲', penuh);
  let kotak = '';
  if(c.alasan === 'tunggu'){
    const m = Math.max(1, Math.ceil((c.tunggu_detik || 60) / 60));
    kotak = `<div class="kartu err kuning"><div class="ik">⏳</div><b>Stempel sudah masuk 👍</b><div class="kecil">Scan berikutnya bisa ${m} menit lagi.</div></div>`;
  } else if(c.alasan === 'sudah_diambil'){
    kotak = `<div class="kartu err"><div class="ik">🔒</div><b>Stempel pesanan ini sudah diambil</b><div class="kecil">Kalau itu pesananmu, bilang ke kasir ya.</div></div>`;
  } else if(c.alasan === 'bukan_ori_besar'){
    kotak = `<div class="kartu err"><div class="ik">🧋</div><b>Pesanan terakhir bukan Original besar</b><div class="kecil">Stempel khusus Es Teh Original <b>besar</b>.</div></div>`;
  } else if(c.alasan === 'diblokir'){
    kotak = `<div class="kartu err"><div class="ik">⛔</div><b>Akun stempel diblokir</b><div class="kecil">Hubungi kasir ya.</div></div>`;
  } else if(st.hadiah_kode){
    kotak = '';
  } else {
    kotak = `<div class="kartu err"><div class="ik">🙏</div><b>Tidak ada pesanan yang bisa diambil</b><div class="kecil">Scan <b>langsung</b> setelah bayar, sebelum kasir melayani pembeli berikutnya.</div></div>`;
  }
  isi().innerHTML = kotak + `<div class="kartu">${kartuStatus(st)}</div><button class="link" onclick="mulai()">🔄 Muat ulang</button>`;
}
mulai();
</script>
</body>
</html>
